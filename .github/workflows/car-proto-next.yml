# CHUBZ (car-proto-next) on every push that touches it: the build, the committed index.html being that build, Biome, types, unit tests,
# the quick harness set and a secret scan (ADR-0008). The whole harness suite runs by hand: Actions → car-proto-next → Run workflow → full.
name: car-proto-next
on:
  push:
    paths: ['car-proto-next/**', '.github/workflows/car-proto-next.yml']
  workflow_dispatch:
    inputs:
      full:
        description: 'Run the whole harness suite (about 20 minutes)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: car-proto-next
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: car-proto-next/package-lock.json
      - run: npm ci
      - name: Build, and the committed index.html and dev/balance/data.json are exactly that build
        run: npm run build && git diff --exit-code --stat -- index.html dev/balance/data.json
      - name: Biome
        run: npx biome ci src
      - name: Types (TypeScript 7) and unit tests (Vitest)
        run: npm run typecheck && npm test
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Harness dependencies
        run: pip install -r dev/requirements.txt && python -m playwright install --with-deps chromium
      - name: Harness, quick set
        if: ${{ !inputs.full }}
        run: python dev/run.py -k shipped,world,errors,solo_smoke
      - name: Harness, whole suite
        if: ${{ inputs.full }}
        run: python dev/run.py
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
