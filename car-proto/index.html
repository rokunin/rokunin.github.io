  #tasks { min-width: 230px; }
  #tasks .ph { display: inline-flex; align-items: center; height: 32px; line-height: 1; padding: 1px 20px 0 18px; font: 900 16px 'Londrina', system-ui, sans-serif; letter-spacing: .05em; color: #f6ead2;
               border-image: var(--i-tape) 0 30 0 30 fill / 0 9px 0 9px stretch; transform: rotate(-1.5deg); text-shadow: 0 1px 0 #000; }
  #tasks .sub { font: 700 18px/1 'Caveat', system-ui, sans-serif; color: #f6ead2; margin: 3px 0 5px 8px; max-width: 240px; text-shadow: 0 1px 0 #000, 0 0 6px rgba(0,0,0,.7); }
  #tasks .tk { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 30px 0 9px; margin: 2px 0; color: #2a2118; font: 700 20px/1 'Caveat', system-ui, sans-serif;
               border-image: var(--i-arrow) 0 70 0 30 fill / 0 24px 0 10px stretch; filter: drop-shadow(0 2px 2px rgba(0,0,0,.35)); }
  #tasks .tk:nth-child(odd) { transform: rotate(.6deg); } #tasks .tk:nth-child(even) { transform: rotate(-.5deg); }
  #tasks .tk i { flex: none; position: relative; width: 15px; height: 15px; margin: 0 2px; border: 2.5px solid #3a2c1f; border-radius: 3px 5px 3px 4px; transform: rotate(-4deg); }
  #tasks .tk.done i::after { content: ''; position: absolute; left: -5px; top: -11px; width: 28px; height: 28px; background: var(--i-tick) center/contain no-repeat; }
  #tasks .tk span { position: relative; white-space: nowrap; }
  #tasks .tk.done span::after { content: ''; position: absolute; left: -3px; right: -3px; top: 50%; height: 6px; margin-top: -2px; background: var(--i-strike) center/100% 100% no-repeat; opacity: .8; }
  #tasks .tk.done { color: #5a4a3a; }
  #tasks .tk.just i::after { animation: tickIn .35s cubic-bezier(.2,1.6,.4,1) both; } #tasks .tk.just span::after { animation: strikeIn .4s .15s ease-out both; }
  #tasks .tk em { font: 700 22px/1 'Caveat', system-ui, sans-serif; font-style: normal; color: #d0561a; margin-left: auto; padding-left: 10px; }
  @keyframes tickIn { from { transform: scale(2.2) rotate(-25deg); opacity: 0; } }
  @keyframes strikeIn { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  #phcard { position: fixed; left: 50%; top: 7%; --k: 1; transform: translateX(-50%) scale(var(--k)); transform-origin: top center; pointer-events: none; opacity: 0; z-index: 7;
             transition: opacity .3s; display: flex; flex-direction: column; align-items: center; white-space: nowrap; }
  #phcard.on { opacity: 1; }
  #phcard .bn { position: relative; height: 128px; min-width: 300px; padding: 0 74px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center;
                border-image: var(--i-banner) 0 110 0 110 fill / 0 49px 0 49px stretch; filter: drop-shadow(0 6px 6px rgba(0,0,0,.45)); }
  #phcard .pn { font: 700 21px/1 'Caveat', system-ui, sans-serif; letter-spacing: .12em; color: #f6ead2; margin: 2px 0 0; opacity: .92; }
  #phcard .nm { font: 900 58px/1 'Londrina', system-ui, sans-serif; letter-spacing: .03em; color: #f28b3a;
                text-shadow: 3px 0 0 #f6ead2, -3px 0 0 #f6ead2, 0 3px 0 #f6ead2, 0 -3px 0 #f6ead2, 2px 2px 0 #f6ead2, -2px 2px 0 #f6ead2, 2px -2px 0 #f6ead2, -2px -2px 0 #f6ead2, 0 6px 0 #1a120c; }
  #phcard .ds { position: relative; margin-top: -16px; height: 40px; line-height: 1; display: flex; align-items: center; padding: 0 40px 0 18px; color: #2a2118; font: 700 24px 'Caveat', system-ui, sans-serif;
                border-image: var(--i-label) 0 60 0 30 fill / 0 30px 0 15px stretch; transform: translateX(26px) rotate(-1.2deg); filter: drop-shadow(0 3px 3px rgba(0,0,0,.4)); }
  #phcard .ds::after { content: ''; position: absolute; right: -40px; top: -22px; width: 58px; height: 62px; background: var(--i-chub) center/contain no-repeat; transform: rotate(14deg); }
  #phcard .cd { margin-top: 8px; height: 46px; line-height: 1; display: flex; align-items: center; padding: 0 30px 0 20px; font: 700 27px 'Caveat', system-ui, sans-serif; letter-spacing: .02em; color: #f6ead2; text-shadow: 0 2px 0 #3a1a08;
                border-image: var(--i-tago) 0 60 0 40 fill / 0 19px 0 13px stretch; transform: translateX(-60px) rotate(3deg); filter: drop-shadow(0 3px 3px rgba(0,0,0,.4)); }
  #phcard .cd.go { border-image-source: var(--i-tagr); }
  #phcard.slap .bn { animation: slap .5s cubic-bezier(.2,1.4,.4,1) both; } #phcard.slap .ds { animation: slap .45s .14s cubic-bezier(.2,1.5,.4,1) both; }
  #phcard.slap .cd { animation: slap .4s .26s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes slap { 0% { opacity: 0; scale: 1.7; rotate: -7deg; } 60% { opacity: 1; scale: .96; rotate: 1.5deg; } 100% { scale: 1; rotate: 0deg; } }
  body.touch #tasks { zoom: .72; } body.touch #tasks .sub.desc { display: none; }
  #net { color: #9cf59a; display: block; font-size: 11px; margin-top: 4px; text-shadow: 0 1px 2px #000; }
  #minimap { position: fixed; right: 14px; bottom: 14px; width: 200px; height: 200px; pointer-events: none; z-index: 4; }
  body.touch #minimap { right: 8px; top: 50px; bottom: auto; width: 116px; height: 116px; }
  #hud b { color: #ffb347; font-weight: 600; }
  #speed { position: fixed; right: 18px; bottom: 14px; color: #e8e6e1; font: 600 28px/1 ui-monospace, monospace;
           background: rgba(20,22,26,.72); padding: 10px 14px; border-radius: 8px; pointer-events: none; }
  #speed small { font-size: 12px; opacity: .6; margin-left: 4px; }
  #hp { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); width: 260px; height: 14px;
        background: rgba(20,22,26,.72); border-radius: 7px; padding: 3px; pointer-events: none; }
  #hpfill { height: 100%; width: 100%; background: #5fd36a; border-radius: 5px; transition: width .12s, background .2s; }
  #dead { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; pointer-events: none;
          color: #ff5a5a; font: 800 44px/1 system-ui, sans-serif; text-shadow: 0 3px 0 #000; letter-spacing: 1px; }
  #abilities { position: fixed; left: 16px; bottom: 14px; display: flex; gap: 8px; pointer-events: none; }
  #weapons { position: fixed; left: 16px; bottom: 90px; display: flex; gap: 6px; pointer-events: none; }
  .wslot { width: 40px; text-align: center; background: rgba(20,22,26,.72); border-radius: 8px; padding: 4px 3px 3px; animation: pop .5s ease-out; }
  .wslot img { width: 34px; height: 34px; display: block; margin: 0 auto 2px; border-radius: 7px; }
  .wslot b { color: #ffd27a; font: 800 10px/1 system-ui, sans-serif; }
  body.touch #weapons { left: 8px; top: 74px; bottom: auto; }
  body.touch .wslot { width: 32px; padding: 3px 2px 2px; }
  body.touch .wslot img { width: 28px; height: 28px; }
  .ab { width: 56px; text-align: center; color: #e8e6e1; font: 600 11px/1.2 system-ui, sans-serif;
        background: rgba(20,22,26,.72); border-radius: 8px; padding: 5px 4px 4px; transition: opacity .3s, filter .3s; }
  .ab img { width: 44px; height: 44px; display: block; margin: 0 auto 3px; border-radius: 8px; }
  .ab.locked { opacity: .28; filter: grayscale(1); }
  .ab { position: relative; }
  .ab .up { display: none; position: absolute; left: 50%; top: -34px; width: 28px; height: 28px; margin-left: -14px; border-radius: 50%; pointer-events: auto; cursor: pointer;
            background: #e8b417; color: #2a1d05; font: 900 24px/27px 'Londrina', system-ui, sans-serif; border: 2px solid #fff6dc; box-shadow: 0 2px 0 #6a4a04, 0 0 10px rgba(255,210,80,.7); animation: upPulse 1s ease-in-out infinite; }
  .ab.can .up { display: block; }
  @keyframes upPulse { 50% { transform: translateY(-3px) scale(1.08); } }
  .ab .lv { position: absolute; right: 2px; top: 1px; color: #ffd23a; font: 900 11px/1 system-ui, sans-serif; text-shadow: 0 1px 0 #000; font-style: normal; }
  .ab .cdv { position: absolute; left: 6px; right: 6px; top: 5px; height: calc(var(--cd, 0) * 44px); background: rgba(10,10,14,.65); border-radius: 0 0 8px 8px; pointer-events: none; }
  #upTag { display: none; align-self: center; padding: 6px 10px; border-radius: 8px; background: #e8b417; color: #2a1d05; font: 900 14px/1 'Londrina', system-ui, sans-serif; letter-spacing: .04em; }
  body.touch #upTag { position: absolute; right: 250px; bottom: 64px; white-space: nowrap; }
  body.touch .ab .cdv { left: 0; right: 0; top: 0; height: calc(var(--cd, 0) * 100%); border-radius: 29px 29px 0 0; }
  .ab.fresh { animation: pop .6s ease-out; }
  @keyframes pop { 0% { transform: scale(1.6); } 100% { transform: scale(1); } }
  #toast { position: fixed; left: 50%; bottom: 64px; transform: translateX(-50%); display: flex; align-items: center; gap: 12px;
           background: rgba(20,22,26,.85); color: #fff; padding: 10px 18px 10px 10px; border-radius: 12px;
           font: 700 18px/1.2 system-ui, sans-serif; pointer-events: none; opacity: 0; transition: opacity .25s; }
  #toast img { width: 48px; height: 48px; border-radius: 8px; }
  #toast small { display: block; font-weight: 500; font-size: 13px; opacity: .75; margin-top: 2px; }
  .hint { position: fixed; left: 0; top: 0; width: 44px; height: 44px; margin: -22px 0 0 -22px; pointer-events: none; z-index: 4; opacity: 0; will-change: transform, opacity; }
  .hint i { position: absolute; inset: 0; }
  .hint i::before { content: ''; position: absolute; left: 50%; top: -9px; margin-left: -8px; border: 8px solid transparent; border-top: 0; border-bottom: 11px solid var(--c); }
  .hint b { position: absolute; inset: 4px; border-radius: 50%; background: rgba(20,22,26,.8); border: 2px solid var(--c); color: var(--c);
            font: 700 12px/32px system-ui, sans-serif; text-align: center; white-space: nowrap; }
  .hint u { position: absolute; top: 46px; text-decoration: none; white-space: nowrap; padding: 1px 7px; border-radius: 6px; background: rgba(20,22,26,.8); color: var(--c); font: 700 11px/16px system-ui, sans-serif; letter-spacing: .03em; text-transform: uppercase; }
  #alert { position: fixed; left: 50%; top: 37%; transform: translateX(-50%); pointer-events: none; opacity: 0;
           color: #ffb347; font: 800 34px/1 system-ui, sans-serif; text-shadow: 0 3px 0 #000; transition: opacity .3s; }
  #bossbar { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); width: 420px; display: none; pointer-events: none;
             text-align: center; color: #ff8fc8; font: 800 15px/1 system-ui, sans-serif; letter-spacing: 3px; text-shadow: 0 2px 0 #000; }
  #bosshp { margin-top: 6px; height: 14px; background: rgba(20,22,26,.8); border-radius: 7px; padding: 3px; }
  #bossfill { height: 100%; width: 100%; background: linear-gradient(90deg, #d040a0, #ff5a8a); border-radius: 5px; transition: width .1s; }
  /* ---- touch layout: two floating sticks, ability buttons in an arc around the right thumb ---- */
  .tc { display: none; }
  .stick { position: fixed; width: 124px; height: 124px; margin: -62px 0 0 -62px; border-radius: 50%; display: none; pointer-events: none;
           border: 2px solid rgba(255,255,255,.22); background: rgba(255,255,255,.05); opacity: .4; transition: opacity .15s; }
  .stick i { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(255,255,255,.32); }
  .stick.on { opacity: 1; }
  #stickR i { background: rgba(255,140,50,.6); }
  body.touch .stick { display: block; }
  body.touch .kb { display: none; }
  body.touch .tc { display: inline; }

<script>
(() => {
  // ---------- colour pipeline ----------
  // Colours are authored in sRGB (hex), lit in linear HDR, then tone-mapped and encoded in the final post pass.
  {
    const C = THREE.Color.prototype, setHex = C.setHex, setStyle = C.setStyle, setHSL = C.setHSL, getHex = C.getHex;
    const scratch = new THREE.Color();
    C.setHex = function (h) { return setHex.call(this, h).convertSRGBToLinear(); };
    C.setStyle = function (st) { return setStyle.call(this, st).convertSRGBToLinear(); };
    C.setHSL = function (h, sat, l) { return setHSL.call(this, h, sat, l).convertSRGBToLinear(); };
    C.getHex = function () { return getHex.call(scratch.copy(this).convertLinearToSRGB()); };
  }
  const srgbTex = c => { const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t; };
  const glow = (mat, k) => { mat.color.multiplyScalar(k); return mat; };   // push an unlit colour into HDR so it blooms

  // ---------- renderer / scene ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  const COARSE = matchMedia('(pointer: coarse)').matches;      // phone / tablet
  let PR = Math.min(devicePixelRatio, COARSE ? 1.5 : 2);
  renderer.setPixelRatio(PR);
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = COARSE ? THREE.PCFShadowMap : THREE.PCFSoftShadowMap;
  renderer.shadowMap.autoUpdate = false;                // refreshed from frame(): every frame on desktop, every 2nd-3rd on phones

  const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x14121c);
  scene.fog = new THREE.Fog(0x241d30, 88, 190);

  // ---------- isometric camera ----------
  let viewSize = COARSE ? 15 : 18;       // half-height of ortho frustum in world units
  const ISO_OFFSET = new THREE.Vector3(30, 30, 30); // classic 45°/35° iso
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 300);
  function resizeCam() {
    const a = innerWidth / innerHeight, v = Math.max(viewSize, 11 / a);   // portrait: never show less than 22 units across
    camera.left = -v * a; camera.right = v * a;
    camera.top = v; camera.bottom = -v;
    camera.updateProjectionMatrix();
  }
  resizeCam();
  const camFocus = new THREE.Vector3();

  // ---------- lights: low warm sun, cool sky fill, blue rim ----------
  const SUN_OFFSET = new THREE.Vector3(-36, 25, 15);
  scene.add(new THREE.HemisphereLight(0xa6b0e6, 0x33262a, 0.17));
  const sun = new THREE.DirectionalLight(0xffc091, 1.35);
  sun.castShadow = true;
  sun.shadow.mapSize.set(COARSE ? 1024 : 2048, COARSE ? 1024 : 2048);
  Object.assign(sun.shadow.camera, { left: -48, right: 48, top: 48, bottom: -48, near: 1, far: 140 });

  // image-based lighting: a small sunset sky rendered once into a PMREM so paint, glass and puddles have something to reflect
  {
    const envScene = new THREE.Scene();
    const geo = new THREE.SphereGeometry(50, 48, 24);
    const pos = geo.attributes.position, col = new Float32Array(pos.count * 3);
    const sd = new THREE.Vector3(-1, 0, -0.75).normalize(), v = new THREE.Vector3(), flat = new THREE.Vector3();   // the iso camera mirrors toward (-1, +y, -1)
    const zen = [0.045, 0.055, 0.12], gnd = [0.02, 0.018, 0.026];
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i).normalize();
      const toward = Math.pow(Math.max(0, flat.set(v.x, 0, v.z).normalize().dot(sd)), 1.5);
      const hor = [0.2 + 0.95 * toward, 0.12 + 0.3 * toward, 0.2 - 0.05 * toward];
      let c;
      if (v.y >= 0) { const k = Math.pow(v.y, 0.45 + 1.3 * toward); c = hor.map((h, j) => h + (zen[j] - h) * k); }
      else { const k = Math.min(1, -v.y * 4); c = hor.map((h, j) => h * 0.4 + (gnd[j] - h * 0.4) * k); }
      col[i * 3] = c[0]; col[i * 3 + 1] = c[1]; col[i * 3 + 2] = c[2];

    envScene.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
    const disc = new THREE.Mesh(new THREE.SphereGeometry(5, 16, 12), new THREE.MeshBasicMaterial());
    disc.material.color.setRGB(16, 8, 3); disc.position.copy(SUN_OFFSET).normalize().multiplyScalar(40); envScene.add(disc);

    scene.environment = pmrem.fromScene(envScene, 0.03).texture;

    try { const hp = bloom.materialHighPassFilter;

      hp.needsUpdate = true; } catch (e) {}
    { const ss = bloom.setSize.bind(bloom), k = COARSE ? 0.5 : 0.75; bloom.setSize = (w, h) => ss(Math.round(w * k), Math.round(h * k)); bloom.setSize(innerWidth * PR, innerHeight * PR); }   // blur chain on a smaller buffer
    if (hdr) [bloom.renderTargetBright, ...bloom.renderTargetsHorizontal, ...bloom.renderTargetsVertical]
      .forEach(t => { t.texture.type = THREE.HalfFloatType; });
    composer.addPass(bloom);
    gradePass = new THREE.ShaderPass({
      uniforms: { tDiffuse: { value: null }, time: { value: 0 }, exposure: { value: 2.0 }, hurt: { value: 0 }, lowHp: { value: 0 } },
      vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
      fragmentShader: `
        uniform sampler2D tDiffuse; uniform float time, exposure, hurt, lowHp; varying vec2 vUv;
        vec3 aces(vec3 x){ return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }
        void main(){
          vec2 d = vUv - 0.5; float r2 = dot(d, d);
          vec2 ca = d * r2 * 0.006;                                   // slight chromatic fringe toward the corners
          vec3 c = vec3(texture2D(tDiffuse, vUv + ca).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv - ca).b);
          c = aces(c * exposure);
          float l = dot(c, vec3(0.2126, 0.7152, 0.0722));

        const sp = osc(0.4, t => 260 * (1 + 0.08 * Math.sin(t * 6.283 * 22) * Math.exp(-t / 0.15))); env(sp, ad(0.002, 0.12)); mix(o, sp, 0.25);
        return norm(o, 0.6);
      },
      jump2(r) {
        const o = R.whoosh(r); const ch = N(o.length / SR);
        for (const [k, t] of [[0, 0], [7, 0.05], [12, 0.1]]) { const s = osc(0.3, 880 * semis(k)); env(s, ad(0.002, 0.08)); mix(ch, s, 0.25, t); }
        return norm(mix(o, ch, 1), 0.6);
      },
      land(r, v) {
        const heavy = v >= 2, o = N(0.5);
        const th = osc(0.3, exp(heavy ? 95 : 85, 42, 0.03)); env(th, ad(0.001, heavy ? 0.1 : 0.07)); mix(o, th, 1);
        const n = noise(0.3, r); filt(n, 'lp', 340); env(n, ad(0.001, 0.06)); mix(o, n, 0.9);
        const cr = osc(0.4, t => 210 + 25 * Math.sin(t * 6.283 * 7)); env(cr, ad(0.02, 0.12)); mix(o, cr, 0.12, 0.03);   // suspension creak
        mix(o, grains(0.35, heavy ? 18 : 9, r, 1200, 3200, 0.004), 0.35);
        return norm(drive(o, 1.5), heavy ? 0.9 : 0.7);
      },
      dig_down(r) {
        const len = 0.65, o = noise(len, r, 'brown'); filt(o, 'lp', 520); env(o, ad(0.02, 0.22));
        mix(o, grains(len, 22, r, 900, 2600, 0.008), 0.6);
        const rum = osc(len, 48); env(rum, ad(0.05, 0.2)); mix(o, rum, 0.5);
        return norm(drive(o, 1.6), 0.8);
      },
      dig_up(r) {
        const o = R.dig_down(r); const pop = osc(0.2, exp(320, 110, 0.04)); env(pop, ad(0.001, 0.05));
        return norm(mix(o, pop, 0.9, 0.04), 0.85);
      },
      scratch(r) {
        const o = N(0.14); mix(o, grains(0.14, 8, r, 1200, 3800, 0.005), 1);
        const n = noise(0.14, r, 'brown'); filt(n, 'lp', 700); env(n, ad(0.005, 0.04)); mix(o, n, 0.6);
        return norm(o, 0.5);
      },
      pickup(r, v, heal) {
        const notes = heal ? [0, 7, 12] : [0, 4, 7, 12, 16], base = heal ? 660 : 880, o = N(0.9);
        notes.forEach((k, i) => {
          const f = base * semis(k), s = osc(0.6, f); mix(s, osc(0.6, f * 2), 0.25); env(s, ad(0.003, 0.22));
          mix(o, s, 0.35, i * 0.065);
        });
        const sp = noise(0.6, r); filt(sp, 'hp', 6500); env(sp, t => Math.exp(-t / 0.2) * (r() < 0.04 ? 1 : 0.15)); mix(o, sp, 0.3);
        return norm(o, 0.6);
      },
      heal(r, v) { return R.pickup(r, v, true); },
      loot(r) {
        const o = N(0.5);
        for (const [k, t] of [[12, 0], [19, 0.08]]) { const s = osc(0.4, 660 * semis(k)); env(s, ad(0.002, 0.12)); mix(o, s, 0.4, t); }
        return norm(o, 0.5);
      },
      boss_emerge(r) {
        const len = 3.4, o = N(len);
        const sub = noise(len, r, 'brown'); filt(sub, 'lp', 140); mix(o, sub, 1.3);
        const gr = noise(len, r); filt(gr, 'bp', 260, 2); env(gr, t => 0.5 + 0.5 * Math.sin(t * 6.283 * 7.3) * Math.sin(t * 6.283 * 2.1)); mix(o, gr, 0.6);
        const ch = N(len);
        for (const f of [55, 82.4, 110, 110.6]) mix(ch, osc(len, f, 'saw'), 0.25);
        filt(ch, 'lp', t => 180 + 1400 * Math.pow(t / len, 1.6), 1.2); mix(o, ch, 0.8);
        mix(o, grains(len, 60, r, 700, 2600, 0.01, 0.8), 0.4);
        env(o, t => Math.min(1, t / 0.6) * Math.min(1, (len - t) / 0.5));
        return norm(drive(o, 1.6), 0.9);
      },
      boss_roar(r) {
        const len = 1.8, o = N(len);
        for (const [f, g] of [[55, 1], [82.4, 0.8], [110, 0.7], [164.8, 0.5], [55.4, 0.6]]) mix(o, osc(len, t => f * (1 + 0.006 * Math.sin(t * 31)), 'saw'), g * 0.3);
        filt(o, 'lp', t => 300 + 2400 * Math.exp(-Math.pow((t - 0.35) / 0.3, 2)) + 500 * (1 - t / len), 1.4);
        env(o, t => Math.min(1, t / 0.08) * Math.exp(-Math.max(0, t - 0.6) / 0.45));
        return norm(drive(o, 2.4), 0.9);
      },
      tent_wind(r) {
        const len = 0.65, o = noise(len, r); filt(o, 'bp', t => 600 + 2800 * Math.pow(t / len, 2), 2);
        env(o, t => Math.pow(t / len, 2));
        const s = osc(len, t => 200 + 420 * t / len, 'saw'); filt(s, 'lp', 900); env(s, t => 0.4 * t / len); mix(o, s, 1);
        return norm(o, 0.6);
      },
      tent_slam(r) {
        const len = 0.7, o = N(len);
        const th = osc(len, exp(80, 34, 0.04)); env(th, ad(0.001, 0.13)); mix(o, th, 1.1);
        const n = noise(len, r); filt(n, 'lp', 700); env(n, ad(0.001, 0.1)); mix(o, n, 0.9);
        const c = noise(0.03, r); filt(c, 'hp', 2000); env(c, ad(0.0002, 0.006)); mix(o, c, 0.9);
        mix(o, grains(len, 30, r, 800, 3000, 0.006, 1.6), 0.5, 0.01);
        return norm(drive(o, 1.8), 0.9);
      },
      boss_lift(r) {
        const len = 1.0, o = N(len);
        for (const f of [220, 330, 331.5]) mix(o, osc(len, t => f * (1 + 0.5 * t / len)), 0.3);
        env(o, t => (0.6 + 0.4 * Math.sin(t * 6.283 * 11)) * Math.min(1, t / 0.2) * Math.min(1, (len - t) / 0.15));
        const n = noise(len, r); filt(n, 'bp', 1800, 3); env(n, t => 0.2 * t / len); mix(o, n, 1);
        return norm(o, 0.45);
      },
      boss_die(r) {
        const len = 3.4, o = N(len);
        const sub = osc(len, exp(60, 18, 0.7)); env(sub, ad(0.002, 0.9)); mix(o, sub, 1.2);
        const n = noise(len, r); filt(n, 'lp', exp(2000, 90, 0.5)); env(n, ad(0.003, 0.7)); mix(o, n, 1.2);
        for (let k = 0; k < 40; k++) { const f = 1800 + r() * 5500; mix(o, modes(0.8, [[f, 1, 0.1 + r() * 0.4]], r), 0.06, Math.pow(r(), 2) * 0.6); }
        const ch = N(len); for (const f of [220, 277, 330]) mix(ch, osc(len, t => f * Math.pow(0.25, t / len), 'saw'), 0.25);
        filt(ch, 'lp', 1200); env(ch, t => Math.min(1, t / 0.3) * Math.exp(-t / 1.4)); mix(o, ch, 0.7, 0.2);
        return norm(drive(o, 1.8), 0.95);
      },
      door(r) {
        const len = 1.5, o = noise(len, r, 'brown'); filt(o, 'lp', 260);
        const gr = noise(len, r); filt(gr, 'bp', 140, 3); env(gr, t => 0.6 + 0.4 * Math.sin(t * 6.283 * 13)); mix(o, gr, 0.8);
        env(o, t => Math.min(1, t / 0.15) * (t < 1.15 ? 1 : Math.exp(-(t - 1.15) / 0.08)));
        const th = osc(0.35, exp(70, 36, 0.05)); env(th, ad(0.001, 0.1)); mix(o, th, 1.2, 1.15);
        return norm(drive(o, 1.4), 0.85);
      },
      nova(r) {
        const len = 0.7, o = N(len);
        const th = osc(len, exp(320, 70, 0.08)); env(th, ad(0.002, 0.12)); mix(o, th, 0.9);
        const sw = noise(len, r); filt(sw, 'bp', t => 500 + 5000 * Math.min(1, t / 0.25), 2); env(sw, ad(0.01, 0.15)); mix(o, sw, 0.6);
        for (const [k, t] of [[24, 0.02], [31, 0.06], [36, 0.1]]) { const s = osc(0.4, 220 * semis(k)); env(s, ad(0.002, 0.1)); mix(o, s, 0.18, t); }
        return norm(drive(o, 1.4), 0.7);
      },
      mortar(r) {
        const len = 0.9, o = N(len);
        const th = osc(0.3, exp(140, 50, 0.04)); env(th, ad(0.001, 0.07)); mix(o, th, 1);
        const n = noise(0.2, r); filt(n, 'lp', 900); env(n, ad(0.001, 0.04)); mix(o, n, 0.8);
        const wh = osc(len, t => 1800 - 1100 * t / len); env(wh, t => 0.25 * Math.min(1, t / 0.2) * Math.min(1, (len - t) / 0.1)); mix(o, wh, 1, 0.05);
        return norm(o, 0.75);
      },
      blast(r) {
        const len = 1.2, o = N(len);
        const n = noise(len, r); filt(n, 'lp', exp(2500, 160, 0.2)); env(n, ad(0.002, 0.25)); mix(o, n, 1.2);
        const sub = osc(len, exp(90, 32, 0.15)); env(sub, ad(0.002, 0.3)); mix(o, sub, 1);
        mix(o, grains(0.9, 40, r, 1400, 4500, 0.003, 2), 0.5, 0.02);
        return norm(drive(o, 2.2), 0.95);
      },
      saw(r) {
        const o = N(0.18), z = osc(0.18, t => 2600 + 1400 * Math.sin(t * 90), 'saw'); filt(z, 'bp', 3200, 2); env(z, ad(0.002, 0.04)); mix(o, z, 0.7);
        const n = noise(0.05, r); filt(n, 'hp', 2500); env(n, ad(0.0003, 0.01)); mix(o, n, 0.8);
        return norm(o, 0.55);
      },
      pop(r) {                                         // paper critter bursts: wet pop + squeak
        const len = 0.35, o = N(len);
        const b = osc(0.12, exp(900, 180, 0.03)); env(b, ad(0.001, 0.05)); mix(o, b, 1);
        const n = noise(0.15, r); filt(n, 'bp', 1800, 1.5); env(n, ad(0.0005, 0.03)); mix(o, n, 0.9);
        const j = 600 * r(), sq = osc(0.15, t => 1300 + j + 900 * Math.sin(t * 40)); env(sq, ad(0.005, 0.05)); mix(o, sq, 0.25, 0.03);
        return norm(drive(o, 1.6), 0.6);
      },
      eshot(r) {                                       // wet plasma blorp
        const len = 0.3, o = N(len);
        const b = osc(len, exp(520, 150, 0.07), 'saw'); filt(b, 'lp', exp(3200, 500, 0.08), 3); env(b, ad(0.003, 0.09)); mix(o, b, 0.8);
        const n = noise(0.1, r); filt(n, 'bp', 2400, 2); env(n, ad(0.0005, 0.02)); mix(o, n, 0.5);
        return norm(drive(o, 1.5), 0.55);
      },
      chub(r) {                                        // squeaky toy
        const len = 0.22, o = N(len), f0 = 850 + 250 * r();
        const a = osc(len, t => f0 * (1 + 3.2 * t) + 60 * Math.sin(t * 190)); env(a, ad(0.004, 0.07)); mix(o, a, 0.8);
        const b = osc(len, t => f0 * 2 * (1 + 3.2 * t)); env(b, ad(0.004, 0.04)); mix(o, b, 0.25);
        return norm(o, 0.5);
      },
laugh(r) {                                       // a big man's belly laugh: breathy "h", open "a", pitch and pace drifting like a voice
        const n = 6 + Math.floor(r() * 3), o = N(3.4);
        let t0 = 0.08, f = 96 * (0.94 + 0.12 * r());
        for (let i = 0; i < n; i++) {
          const dur = 0.17 + 0.06 * r() + (i === n - 1 ? 0.2 : 0), amp = Math.max(0.3, 1 - i * 0.085) * (0.8 + 0.4 * r());
          const fi = f * (i === 0 ? 1.15 : 1), wob = 4 + 3 * r(), ph = r() * 6.283;
          // glottal source: saw with jitter, a wobble and a falling glide on every syllable
          const src = osc(dur, t => fi * (1.2 - 0.55 * t / dur) * (1 + 0.03 * Math.sin(t * 6.283 * wob + ph)) * (1 + 0.035 * (r() - 0.5)), 'saw');
          const f1 = Float32Array.from(src), f2 = Float32Array.from(src), f3 = Float32Array.from(src);
          const open = 0.9 + 0.2 * r();                 // the mouth is never the same twice
          filt(f1, 'bp', 640 * open, 4.5); filt(f2, 'bp', 1080 * open, 6); filt(f3, 'bp', 2450, 7); filt(src, 'lp', 260, 0.8);
          const v = N(dur); mix(v, src, 0.55); mix(v, f1, 1); mix(v, f2, 0.55); mix(v, f3, 0.16);
          const br = noise(dur, r); filt(br, 'bp', 1500, 1); mix(v, br, 0.07);       // breath riding on the voice
          env(v, t => Math.min(1, t / 0.035) * Math.min(1, (dur - t) / 0.09));
          const h = noise(0.1, r); filt(h, 'bp', 1250 * open, 1.3); env(h, t => Math.sin(Math.min(1, t / 0.1) * Math.PI));
          mix(o, h, 0.3 * amp, t0 - 0.07); mix(o, v, amp, t0);
          t0 += dur + 0.06 + 0.07 * r() + (i === 2 && r() < 0.5 ? 0.12 : 0);
          f *= 0.94 + 0.03 * r();
        }
        const chest = Float32Array.from(o); filt(chest, 'lp', 180, 0.7); mix(o, chest, 0.5);
        return norm(drive(o, 1.25), 0.95);
      },
      choir(r) {                                       // slow swell of voices
        const len = 9, o = N(len);
        for (const [k, g] of [[0, 1], [7, 0.8], [12, 0.9], [16, 0.7], [19, 0.6], [24, 0.4]]) for (let v = 0; v < 3; v++) {
          const f0 = 130.8 * semis(k) * (1 + (v - 1) * 0.006), vr = 4.5 + r() * 1.5, ph = r() * 6.283;
          const a = osc(len, t => f0 * (1 + 0.006 * Math.sin(t * 6.283 * vr + ph)), 'saw'); filt(a, 'bp', 800, 1.2); filt(a, 'lp', 2400, 0.7);
          env(a, t => Math.min(1, t / 2.5) * Math.min(1, (len - t) / 3)); mix(o, a, g * 0.3);
        }
        return norm(o, 0.7);
      },
      spit(r) {
        const len = 0.4, o = N(len);
        const n = noise(len, r); filt(n, 'bp', t => 700 + 2200 * Math.min(1, t / 0.08), 3); env(n, ad(0.005, 0.12)); mix(o, n, 1);
        const g = osc(0.25, exp(260, 120, 0.06)); env(g, t => ad(0.01, 0.08)(t) * (0.6 + 0.4 * Math.sin(t * 6.283 * 45))); mix(o, g, 0.6);
        return norm(o, 0.55);
      },
      wave(r) {                                        // distant horn + rumbling crowd
        const len = 2.2, o = N(len);
        for (const k of [0, 7, 12]) { const h = osc(len, 98 * semis(k) * (1 + 0.004 * k), 'saw'); filt(h, 'lp', 900); env(h, t => Math.min(1, t / 0.25) * Math.exp(-Math.max(0, t - 0.9) / 0.35) * 0.3); mix(o, h, 1); }
        const c = noise(len, r); filt(c, 'bp', 420, 1.2); env(c, t => Math.min(1, t / 0.6) * Math.exp(-Math.max(0, t - 1.2) / 0.4) * (0.7 + 0.3 * Math.sin(t * 6.283 * 7))); mix(o, c, 0.5);
        return norm(o, 0.7);
      },
      hoof(r) {                                        // unicorn hoofbeat: dull thump plus a hard clack
        const len = 0.16, o = N(len);
        const b = osc(0.12, exp(150 + 40 * r(), 55, 0.04)); env(b, ad(0.001, 0.035)); mix(o, b, 1);
        const n = noise(0.05, r); filt(n, 'bp', 900 + 500 * r(), 2.5); env(n, ad(0.0004, 0.012)); mix(o, n, 0.9);
        return norm(o, 0.55);
      },
      tick(r) {                                        // spider foot: small metallic tap
        const len = 0.07, o = N(len);
        const n = noise(0.03, r); filt(n, 'bp', 3200 + 1500 * r(), 3); env(n, ad(0.0003, 0.006)); mix(o, n, 1);
        const s = osc(0.05, 1500 + 900 * r(), 'tri'); env(s, ad(0.0005, 0.012)); mix(o, s, 0.35);
        return norm(o, 0.4);
      },
      // ---- loops (rendered once, played continuously with live gain / rate) ----
      hum_loop() {                                     // the halo: a soft held chord of pure tones, like a far-off choir. No motor in it
        return looped(4, sec => {
          const b = N(sec);
          for (const [f, g, v] of [[220, 1, 0.25], [220.5, 0.7, 0.5], [277.25, 0.7, 0.25], [329.75, 0.8, 0.5], [330.25, 0.5, 0.25], [440, 0.45, 0.75], [554.25, 0.2, 0.5], [659.5, 0.14, 0.25]]) {
            const o = osc(sec, f); env(o, t => 0.65 + 0.35 * Math.sin(t * 6.283 * v + f)); mix(b, o, g * 0.2);
          }
          return filt(b, 'lp', 1200);
        });
      },
      servo_loop() {                                   // the spider: thin servo whine
        return looped(1, sec => {
          const b = osc(sec, 180, 'saw'); mix(b, osc(sec, 362, 'saw'), 0.5); filt(b, 'bp', 1400, 2.5);
          env(b, t => 0.6 + 0.4 * Math.sin(t * 6.283 * 22));
          return b;
        });
      },
      engine_loop() {                                  // 40 firing pulses per second; rate follows speed
        return looped(1, sec => {
          const b = N(sec), r = rng(7);
          for (let k = 0; k < Math.ceil(sec * 40); k++) {
            const p = noise(0.03, r); filt(p, 'lp', 520); env(p, ad(0.0008, 0.0075));
            const s = osc(0.03, 40 * (k % 2 ? 2 : 3)); env(s, ad(0.0006, 0.006)); mix(p, s, 0.6);
            mix(b, p, k % 4 === 0 ? 1 : 0.7, k / 40);
          }
          return filt(b, 'lp', 1400);
        });
      },
      drill_loop() {
        return looped(1, sec => {
          const b = osc(sec, 110, 'saw'); mix(b, osc(sec, 55, 'square'), 0.35); mix(b, osc(sec, 220.5, 'saw'), 0.2);
          filt(b, 'lp', 1700, 1.2);
          const n = noise(sec, rng(3)); filt(n, 'bp', 2600, 1.5); env(n, t => 0.5 + 0.5 * Math.sin(t * 6.283 * 30)); mix(b, n, 0.25);
          return b;
        });
      },
      grind_loop() {
        return looped(1, sec => {
          const r = rng(5), b = noise(sec, r); filt(b, 'bp', 1900, 0.9);
          const a = noise(sec, r); filt(a, 'lp', 35); const m = Math.max(...a.map(Math.abs)) || 1;
          env(b, t => 0.4 + 0.6 * Math.abs(a[Math.min(a.length - 1, Math.round(t * SR))] / m));
          mix(b, grains(sec, 60, r, 1500, 5000, 0.003, 1), 0.6);
          return b;
        });
      },
      skid_loop() {
        return looped(1, sec => { const b = noise(sec, rng(9)), c = Float32Array.from(b); filt(b, 'bp', 1500, 3); filt(c, 'bp', 920, 4); return mix(b, c, 0.8); });
      },
      wind_loop() {
        return looped(4, sec => { const b = noise(sec, rng(11), 'pink'); filt(b, 'lp', t => 380 + 220 * Math.sin(t * 1.6), 0.8); return b; });
      },
      drone_loop() {
        return looped(4, sec => {
          const b = N(sec); for (const [f, g] of [[55, 1], [82.5, 0.6], [110.25, 0.5], [165, 0.2]]) mix(b, osc(sec, f, 'tri'), g * 0.3);
          const n = noise(sec, rng(13)); filt(n, 'bp', 330, 6); mix(b, n, 0.4);
          return b;
        });
      },
    };

    function synth(name, v) { return R[name](rng(1000 + v * 7919 + name.length * 131), v); }
    function normLoop(b, peak) { let m = 1e-6; for (let i = 0; i < b.length; i++) m = Math.max(m, Math.abs(b[i])); for (let i = 0; i < b.length; i++) b[i] *= peak / m; return b; }
    return { synth, normLoop, R };
  }

  // ---------- AUDIO: no sound files, every sound is synthesised at startup ----------
  // A bank of recipes renders into AudioBuffers (several random variants each), then plays through
  // buses with voice limits, distance falloff and stereo pan from the camera's point of view.
  const SFX = (() => {
    const AC = window.AudioContext || window.webkitAudioContext;
    let ctx = null, master = null, sfxBus = null, loopBus = null, verbIn = null, ready = false;
    let SR = 44100, muted = false, roomVerb = 0, vol = 0.5;
    try { const v = parseFloat(localStorage.getItem('carproto.vol')); if (v >= 0 && v <= 1) vol = v; } catch (e) {}
    try { muted = localStorage.getItem('carproto.mute') === '1'; } catch (e) {}
    const bank = {}, voices = {}, lastPlay = {}, loops = {};
    const projV = new THREE.Vector3();

    // name -> recipe, variants, gain, voice limit, min gap between plays (s), reverb send
    const DEFS = {
      hoof:        { n: 4, g: 0.4,  max: 6,  gap: 0 },
      tick:        { n: 4, g: 0.2,  max: 8,  gap: 0.02 },
      shot:        { n: 4, g: 0.42, max: 6,  gap: 0.03, verb: 0.18 },
      hit_wood:    { n: 4, g: 0.35, max: 5,  gap: 0.025 },
      hit_stone:   { n: 4, g: 0.3,  max: 5,  gap: 0.025, verb: 0.15 },
      hit_flesh:   { n: 3, g: 0.45, max: 5,  gap: 0.03 },
      hit_dirt:    { n: 3, g: 0.25, max: 4,  gap: 0.03 },
      hit_boss:    { n: 3, g: 0.32, max: 4,  gap: 0.05, verb: 0.25 },
      crate_break: { n: 3, g: 0.7,  max: 4,  verb: 0.15 },
      growl:       { n: 3, g: 0.55, max: 3,  gap: 0.12 },
      growl_elite: { n: 2, g: 0.65, max: 2,  gap: 0.2,  verb: 0.2 },
      chomp:       { n: 3, g: 0.6,  max: 3,  gap: 0.05 },

  function respawn() {

  const enemyRed = new THREE.MeshStandardMaterial({ color: 0xd42a36, emissive: 0x3a0406, roughness: 0.4, metalness: 0.15 });

  function makeEnemy(elite = false) {
    const s = elite ? rand(2.9, 3.4) : rand(1.9, 2.4), lowH = s * 0.45, upH = s * 0.55;
    const root = new THREE.Group(), hop = new THREE.Group();
    root.add(hop); scene.add(root);
    const lower = new THREE.Mesh(new THREE.BoxGeometry(s, lowH, s), crateMat);
    lower.position.y = lowH / 2; hop.add(lower);
    const gullet = new THREE.Mesh(new THREE.BoxGeometry(s * 0.86, 0.04, s * 0.86), mouthMat);
    gullet.position.y = lowH + 0.01; hop.add(gullet);
    const pivot = new THREE.Group(); pivot.position.set(0, lowH, -s / 2); hop.add(pivot);
    const upper = new THREE.Mesh(new THREE.BoxGeometry(s, upH, s), crateMat);
    upper.position.set(0, upH / 2, s / 2); pivot.add(upper);
    // split the crate texture across the two jaws so a sleeping biter looks exactly like a real crate
    const sideV = (geo, v0, v1) => { const uv = geo.attributes.uv; for (let i = 0; i < 24; i++) if (i < 8 || i >= 16) uv.setY(i, v0 + uv.getY(i) * (v1 - v0)); };
    sideV(lower.geometry, 0, 0.45); sideV(upper.geometry, 0.45, 1);
    const roofOfMouth = new THREE.Mesh(new THREE.BoxGeometry(s * 0.86, 0.04, s * 0.86), mouthMat);
    roofOfMouth.position.set(0, -0.01, s / 2); pivot.add(roofOfMouth);

    // everything below only shows once the biter wakes up; asleep it is a plain crate
    const awakeParts = [];
    const part = (geo, mat, parent, x, y, z, rx = 0, ry = 0, rz = 0) => {
      const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.rotation.set(rx, ry, rz); parent.add(m); awakeParts.push(m); return m;
    };

    const trim = elite ? eliteTrim : redTrim;
    const n = elite ? 6 : 5;                                    // front row: uneven fangs, long canines at the corners
    for (let i = 0; i < n; i++) {

        part(fang(s * 0.045, h), toothMat, pivot, side * (s / 2 - s * 0.07), -h / 2, s / 2 + z + s * 0.08, Math.PI);

      part(new THREE.BoxGeometry(s * 0.27, s * 0.13, 0.08), elite ? eyeElite : eyeWhite, pivot, side * s * 0.24, upH * 0.5, s + 0.03, 0, 0, side * 0.3);
      part(new THREE.BoxGeometry(s * 0.045, s * 0.13, 0.1), pupilMat, pivot, side * s * 0.22, upH * 0.5, s + 0.05, 0, 0, side * 0.3);
      part(new THREE.BoxGeometry(s * 0.38, s * 0.09, s * 0.14), trim, pivot, side * s * 0.25, upH * 0.5 + s * 0.13, s + 0.03, 0, 0, side * 0.42);
      // horns sweep out and back

      part(new THREE.ConeGeometry(s * 0.12, hh, 5), hornMat, pivot, side * s * 0.36, upH + hh * 0.38, s * 0.58, -0.45, 0, -side * 0.55);
      for (const fz of [-1, 1]) {                               // stubby clawed feet
        part(new THREE.BoxGeometry(s * 0.2, s * 0.13, s * 0.3), trim, hop, side * (s / 2 + s * 0.06), s * 0.065, fz * s * 0.3 + s * 0.04);
        part(fang(s * 0.05, s * 0.16), toothMat, hop, side * (s / 2 + s * 0.08), s * 0.05, fz * s * 0.3 + s * 0.25, Math.PI / 2);
      }

    part(new THREE.BoxGeometry(s * 0.3, s * 0.04, s * 0.62), tongueMat, hop, 0, lowH + s * 0.03, s * 0.22, 0.08);   // tongue lolls out the front
    for (let i = 0; i < 3; i++) {                               // spines down the back
      const h = s * (0.26 - i * 0.05);

      const a = i / 5 * Math.PI * 2 + 0.3;
      const c = part(new THREE.OctahedronGeometry(s * 0.1, 0), crystalMat, pivot, Math.cos(a) * s * 0.3, upH + s * 0.13, s * 0.52 + Math.sin(a) * s * 0.3, Math.sin(a) * 0.45, 0, -Math.cos(a) * 0.45);

    awakeParts.forEach(p => p.visible = false);

    const e = { root, hop, pivot, lower, upper, awakeParts, s, r: s * 0.62,

                hp: 4, awake: false, dead: false, flash: 0, biteCd: 0, phase: rand(0, 6), wakeT: 0, open: 0,

                elite, maxHp: elite ? 30 : 10, bite: elite ? 26 : 16, shotCd: rand(1, 3), charge: 0,

  }

  function setEnemyLook(e, mat) { e.lower.material = mat; e.upper.material = mat; }
  function flickerElite(e) {                       // мерцание: переливается и искрит
    const t = elapsed * 6 + e.phase, spark = Math.random() < 0.07 ? 1 : 0;
    if (e.awake) {

      e.matAwake.emissive.setHSL((0.8 + 0.12 * Math.sin(t)) % 1, 1, 0.5).multiplyScalar(0.015 + 0.045 * (0.5 + 0.5 * Math.sin(t * 2.3)) + spark * 0.9);

      e.matDormant.emissive.setHSL(0.1, 1, 0.5).multiplyScalar(0.02 + 0.09 * (0.5 + 0.5 * Math.sin(t)) + spark * 1.6);   // ящик, но подозрительно блестит
    }
  }

  function placeEnemy(e) {
    const [x, z] = freeSpot(e.s, 30);
    e.pos.set(x, 0, z); e.vel.set(0, 0, 0);

    e.carried = false; e.root.rotation.set(0, 0, 0); e.root.position.y = 0;

  function wakeEnemy(e) {

  function hurtCar(dmg, dir) {

    if (haloHoly()) { if ((car.holyT || 0) < elapsed) { car.holyT = elapsed + 0.25; SFX.play('pickup', car.pos, { vol: 0.25, rate: 2 }); spawnParticles(tmp.set(car.pos.x, 2, car.pos.z), 0xffe9a8, 4, 6); } return; }   // swords out: untouchable

  function pushOutOfBox(pos, r, o) {
    const p = o.mesh.position;
    const cx = THREE.MathUtils.clamp(pos.x, p.x - o.hx, p.x + o.hx);
    const cz = THREE.MathUtils.clamp(pos.z, p.z - o.hz, p.z + o.hz);
    const dx = pos.x - cx, dz = pos.z - cz, d = Math.hypot(dx, dz);
    if (d >= r) return;
    if (d > 1e-4) { pos.x += dx / d * (r - d); pos.z += dz / d * (r - d); }
    else {
      const ox = o.hx - Math.abs(pos.x - p.x), oz = o.hz - Math.abs(pos.z - p.z);
      if (ox < oz) pos.x += (Math.sign(pos.x - p.x) || 1) * (ox + r);
      else pos.z += (Math.sign(pos.z - p.z) || 1) * (oz + r);
    }
  }

  const enemyQueue = [];
  let diggers = 0;
  function enemyBump(e) {                               // the car pushes against a cube, asleep or awake; ramming a sleeping one hurts it
    const dx = car.pos.x - e.pos.x, dz = car.pos.z - e.pos.z, dist = Math.hypot(dx, dz) || 1e-4, nx = dx / dist, nz = dz / dist, minD = car.radius + e.r;
    if (!(car.alive && car.depth < 0.3 && car.y < e.s * 0.8 && dist < minD)) return;
    const push = minD - dist, own = !NET.client, share = e.awake && own ? 0.5 : 1;
    car.pos.x += nx * push * share; car.pos.z += nz * push * share;
    if (e.awake && own) { e.pos.x -= nx * push * 0.5; e.pos.z -= nz * push * 0.5; }
    const vn = car.vel.x * -nx + car.vel.z * -nz;
    if (!e.awake && vn > RAM_SPEED && (e.ramT || 0) < elapsed) {          // протаранили «ящик» — а он живой
      e.ramT = elapsed + 0.5;
      hitEnemy(e, tmp.set(-nx, 0, -nz), 1, 14); SFX.play('hit_flesh', e.pos);
      e.stun = 0.6; shake = Math.max(shake, 0.3);
      car.speed *= 0.7;
    } else if (vn > 0) { car.vel.x += nx * vn; car.vel.z += nz * vn; car.speed *= 0.6; }
  }
  function enemyMirror(e, dt) {                         // a guest's copy of a host cube: glide to where the host says, animate the rest here
    if (e.tx == null) { e.tx = e.pos.x; e.tz = e.pos.z; e.tyaw = e.yaw; }
    const k = 1 - Math.exp(-10 * dt);
    if (Math.abs(e.tx - e.pos.x) + Math.abs(e.tz - e.pos.z) > 20) { e.pos.x = e.tx; e.pos.z = e.tz; } else { e.pos.x += (e.tx - e.pos.x) * k; e.pos.z += (e.tz - e.pos.z) * k; }
    if (e.elite) flickerElite(e);
    e.root.position.set(e.pos.x, e.hostCarry ? 1.6 : 0, e.pos.z);
    if (!e.awake) { e.hop.scale.y = 1 + Math.sin(elapsed * 2.2 + e.phase) * 0.025; e.root.rotation.y = e.yaw; return; }
    e.yaw = angLerp(e.yaw, e.tyaw, Math.min(1, 10 * dt)); e.root.rotation.y = e.yaw;
    e.phase += dt * 9;
    const h = Math.abs(Math.sin(e.phase)); e.wakeT = Math.max(0, e.wakeT - dt);
    const surprise = e.wakeT > 0 ? Math.sin((1 - e.wakeT / 0.45) * Math.PI) * 2.2 : 0;
    e.hop.position.y = h * 0.55 + surprise;
    const squash = 1 - (1 - h) * 0.18; e.hop.scale.set(1 + (1 - squash) * 0.6, squash, 1 + (1 - squash) * 0.6);
    e.open += ((e.topen == null ? 0.25 : e.topen) - e.open) * Math.min(1, 14 * dt); e.pivot.rotation.x = -e.open;
    e.flash -= dt; setEnemyLook(e, e.flash > 0 ? enemyFlash : e.matAwake);
  }
  function enemyDieFx(e) {
    spawnParticles(tmp.copy(e.pos).setY(1), e.elite ? 0xd040a0 : 0xc8323c, e.elite ? 30 : 18, e.elite ? 12 : 10);
    flash(tmp, e.elite ? 0xff40c8 : 0xff4a30, e.elite ? 10 : 5.5, e.elite ? 0.32 : 0.22, 2.2); burst(tmp, e.elite ? 0x70305f : 0x5a2a2a, e.elite ? 9 : 5, 1.8, 4);
    spawnParticles(tmp.copy(e.pos).setY(1), 0xf4f1e8, 6, 8);
    SFX.play(e.elite ? 'elite_die' : 'biter_die', e.pos);
  }
  function updateEnemies(dt) {
    diggers = 0;
    for (let ei = 0; ei < enemies.length; ei++) {
      const e = enemies[ei];
      if (NET.client) { if (!!e.carried !== !!e.gSent) { e.gSent = !!e.carried; e.tx = e.pos.x; e.tz = e.pos.z; netEv({ t: 'eg', i: ei, c: e.carried ? 1 : 0, x: r1(e.pos.x), z: r1(e.pos.z) }, NET.hostPeer); } }
      if (e.dead || e.carried) continue;
      enemyBump(e);                                     // my ride shoves against it, whoever runs it
      if (NET.client) { enemyMirror(e, dt); continue; }  // a guest only shows what the host's cubes do
      e.ramCd -= dt;
      if ((e.think = (e.think || 0) - dt) <= 0) { e.think = 0.3 + Math.random() * 0.2; e.tgt = netPick(e); }
      const T = e.tgt && e.tgt.up && NET.remotes.get(e.tgt.peer) === e.tgt ? e.tgt.tc : car, mine = T === car, seen = mine ? carSeen() : T.alive;
      const dx = T.pos.x - e.pos.x, dz = T.pos.z - e.pos.z;
      const dist = Math.hypot(dx, dz) || 1e-4;
      const nx = dx / dist, nz = dz / dist;
      const minD = car.radius + e.r;

      if (e.elite) flickerElite(e);
      if (!e.awake) {
        e.hop.scale.y = 1 + Math.sin(elapsed * 2.2 + e.phase) * 0.025;   // еле заметно дышит
        if (seen && dist < WAKE_DIST) wakeEnemy(e);
        continue;
      }

      // погоня
      let tx = 0, tz = 0;
      const hunting = mine && e.elite && car.alive && !carSeen();               // архизлюка лезет к норе откапывать
      const scared = mine && car.alive && !carSeen() && !e.elite;
      let digging = false;
      const preyC = !hunting && (dist > 16 || !seen) ? groundChubNear(e.pos, 20) : null;
      if (preyC) { const px = preyC.pos.x - e.pos.x, pz = preyC.pos.z - e.pos.z, pd = Math.hypot(px, pz) || 1; tx = px / pd * e.speed; tz = pz / pd * e.speed; }
      else if (seen) { tx = nx * e.speed; tz = nz * e.speed; }
      else if (hunting) {
        if (dist > car.radius + e.r + 0.4) { tx = nx * e.speed; tz = nz * e.speed; }
        else if (e.stun <= 0) { digging = true; diggers++; e.vel.multiplyScalar(0.8); }
      }
      else if (scared && dist < 42) {                                   // разбегаются от норы
        const jit = Math.sin(e.phase * 0.37 + e.s * 10) * 0.6;          // каждый в свою сторону
        const ax = -nx * Math.cos(jit) + nz * Math.sin(jit), az = -nz * Math.cos(jit) - nx * Math.sin(jit);
        tx = ax * e.speed * 1.15; tz = az * e.speed * 1.15;
      }
      if (e.stun > 0) { e.stun -= dt; tx = tz = 0; }                    // оглушён после броска
      for (const o of enemies) {                                        // не слипаться
        if (o === e || o.dead || o.carried) continue;
        const sx = e.pos.x - o.pos.x, sz = e.pos.z - o.pos.z, sd = Math.hypot(sx, sz);
        if (sd < e.r + o.r + 0.6 && sd > 1e-4) { tx += sx / sd * 6; tz += sz / sd * 6; }
      }
      const k = Math.min(1, 3.2 * dt);
      e.vel.x += (tx - e.vel.x) * k; e.vel.z += (tz - e.vel.z) * k;
      e.pos.addScaledVector(e.vel, dt);
      for (const o of obstacles) if (active(o)) pushOutOfBox(e.pos, e.r, o);
      const sh = shield();
      if (sh) {                                                         // щит на буре — сквозь него не пройти
        const sx = e.pos.x - sh.x, sz = e.pos.z - sh.z, sd = Math.hypot(sx, sz) || 1e-4, minS = e.r + sh.r;
        if (sd < minS) { e.pos.x = sh.x + sx / sd * minS; e.pos.z = sh.z + sz / sd * minS; }
      }
      const lim = ARENA - 1 - e.r;
      e.pos.x = THREE.MathUtils.clamp(e.pos.x, -lim, lim);
      e.pos.z = THREE.MathUtils.clamp(e.pos.z, -lim, lim);

      // повернуться к машине (или от неё, если удирает)
      const want = scared ? Math.atan2(e.vel.x, e.vel.z) : Math.atan2(nx, nz);
      let dy = want - e.yaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy));

          if (e.dead || e.carried || c.hit.has(e) || Math.hypot(e.pos.x - p.x, e.pos.z - p.z) > c.r + e.r || p.y > e.s + c.r) continue;
          c.hit.add(e);

        }

          if (!active(o) || o.wall || o.boss) continue;
          const q = o.mesh.position;
          if (Math.abs(p.x - q.x) > o.hx + c.r * 0.6 || Math.abs(p.z - q.z) > o.hz + c.r * 0.6 || p.y > o.h + c.r) continue;
          if (o.crate) damageCrate(o, 99);
          else if ((o.pillar || o.rock) && sp > 16 && c.r > 0.8) smashPillar(o, c.v);
          else { c.v.x *= -0.3; c.v.z *= -0.3; }
        }
      }
      if (c.life < 1) c.m.scale.setScalar(c.r * Math.max(0.01, c.life));

  }

  // ---------- drill logic ----------
  const DRILL_DPS = 7, DRILL_REACH = 4.6 * 1.5;   // радиус арки урона от центра машины
  let drillRPM = 0, drillSparkT = 0;
  function crateSpot(o) {                                // where a broken crate comes back: derived from the crate and its respawn count, so every player gets the same spot
    o.rc = (o.rc || 0) + 1; let s = (SEED + obstacles.indexOf(o) * 9973 + o.rc * 131) >>> 0, x = 0, z = 0;
    const rnd = () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };

    return Math.hypot(dx, dz) - r < DRILL_ARC_R * drillRMul() && along > -r * 0.6;
  }
  let drillCyc = 0;
  function drillAuto(dt) {                                 // on for a moment each cycle, half a cycle away from the nova burst
    const D = 1.0 + (abLv.drill >= 1 ? 0.5 : 0);

  // подсветка арки на земле

  const arcEdgeMat = new THREE.MeshBasicMaterial({ color: 0xffc06a, transparent: true, opacity: 0, depthWrite: false });
  const drillArc = new THREE.Group();
  {
    const fill = new THREE.CircleGeometry(DRILL_ARC_R, 48, Math.PI, Math.PI); fill.rotateX(-Math.PI / 2);
    const edge = new THREE.RingGeometry(DRILL_ARC_R - 0.22, DRILL_ARC_R, 48, 1, Math.PI, Math.PI); edge.rotateX(-Math.PI / 2);

  function updateDrill(dt) {

    if (drillRPM < 0.55) SFX.loop('grind', 0, 1);

    // арка: видна, пока бур крутится, ярче на полных оборотах

      const k = Math.min(1, drillRPM / 0.55);

      arcEdgeMat.opacity = 0.75 * k;

        const rad = 1 + t * (DRILL_ARC_R - 1.2);

    }
    if (drillRPM < 0.55) { drillMat.emissive.setHex(0); return; }

    const dmg = DRILL_DPS * dt * drillRPM * (abLv.drill >= 2 ? 1.5 : 1);
    let grinding = false;
    drillSparkT -= dt;
    const spark = drillSparkT <= 0;
    if (spark) drillSparkT = 0.05;
    const tipPos = new THREE.Vector3(), away = new THREE.Vector3();

    for (const e of enemies) {
      if (e.dead || (e.carried && !(grab.held && grab.held.ref === e)) || !inDrillArc(e.pos.x, e.pos.z, e.r)) continue;
      grinding = true;
      away.set(e.pos.x - car.pos.x, 0, e.pos.z - car.pos.z).normalize();
      hitEnemy(e, away, dmg, 26 * dt);          // dmg дробный, отталкивает от машины
      e.biteCd = Math.max(e.biteCd, 0.25);      // пока в арке — не кусается

    }
    for (const m of swarm) {
      if (m.dead || !inDrillArc(m.pos.x, m.pos.z, m.r)) continue;
      grinding = true;
      away.set(m.pos.x - car.pos.x, 0, m.pos.z - car.pos.z).normalize();
      m.cd = Math.max(m.cd, 0.25);
      if (spark) spawnParticles(tipPos.copy(m.pos).setY(1 + rand(0, 0.8)), m.art.color, 2, 6);

    }
    for (const o of obstacles) {
      if (!o.mesh.visible || o.wall || o.disabled || (o.carried && !(grab.held && grab.held.ref === o))) continue;
      const p = o.mesh.position, r = Math.max(o.hx, o.hz);

      else if (o.crate) { grinding = true; damageCrate(o, dmg); }

      else grinding = true;
      if (spark) spawnParticles(tipPos.copy(p).setY(0.8 + rand(0, 0.6)).addScaledVector(away, -r),
                                o.crate ? 0xd2873c : 0xffe08a, 2, 7);
    }
    drillMat.emissive.setHex(grinding ? 0xff4a00 : 0x000000);
    arcEdgeMat.color.setHex(grinding ? 0xffe9b0 : 0xffc06a).multiplyScalar(3.5);
    if (grinding) { shake = Math.max(shake, 0.18); car.speed *= 1 - 1.5 * dt; }
    SFX.loop('grind', grinding ? 0.4 * drillRPM : 0, 0.9 + 0.2 * drillRPM);
  }

  // ---------- grabber logic ----------
  // Рука на мачте у правого переднего угла, сама поворачивается в курсор. Цель ищет в конусе
  // вокруг направления на курсор (берёт ближайшую к курсору), хватает и тянет на бур.
  const ARM_MIN = 0.35, ARM_MAX = 16, ARM_SPEED = 70, PULL_SPEED = 30, HOLD_Y = 1.15, G = 26;
  const ARM_CONE = THREE.MathUtils.degToRad(13 * 2.5);   // ±32.5° вокруг направления на курсор
  const CLAW_REACH = 0.85;                                   // от основания клешни до кончиков пальцев
  const grab = { state: 'idle', len: ARM_MIN, open: 0.15, yaw: Math.PI / 2, held: null, target: null };
  const thrown = [];
  const holdPos = new THREE.Vector3(), armW = new THREE.Vector3(), restDir = new THREE.Vector3();

  function toWorld(lx, lz, out) {                            // координаты машины → мир
    const c = Math.cos(car.heading), sn = Math.sin(car.heading);
    return out.set(car.pos.x + lx * c + lz * sn, 0, car.pos.z - lx * sn + lz * c);
  }
  function yawToward(x, z) {                                 // arm.rotation.y (в осях кузова), чтобы рука смотрела в точку
    const rel = Math.atan2(x - armW.x, z - armW.z) - car.heading;

  }

  // маркер над целью
  const targetMarker = new THREE.Mesh(new THREE.ConeGeometry(0.5, 0.95, 4),
    glow(new THREE.MeshBasicMaterial({ color: 0xffb347 }), 3));
  targetMarker.rotation.x = Math.PI; scene.add(targetMarker);

  function releaseIfHeld(ref) {
    if (grab.held && grab.held.ref === ref) { grab.held = null; grab.state = 'retract'; }
    if (grab.target && grab.target.ref === ref) grab.target = null;
    for (let i = thrown.length - 1; i >= 0; i--) if (thrown[i].ref === ref) thrown.splice(i, 1);
  }

  const tgtPos = t => t.kind === 'enemy' ? t.ref.pos : t.ref.mesh.position;
  const tgtValid = t => t && (t.kind === 'enemy' ? !t.ref.dead && !t.ref.carried : active(t.ref));

  function findCandidate() {
    let best = null, bestD = Infinity;

      const dx = p.x - armW.x, dz = p.z - armW.z, d = Math.hypot(dx, dz);

  function placeHeld(h) {
    if (h.kind === 'enemy') {

  function finishThrown(th, i) {

  function updateGrab(dt) {

      const step = PULL_SPEED * dt, gap = holdPos.distanceTo(dest);

      else holdPos.addScaledVector(dest.sub(holdPos).normalize(), step);

      }

      aimYaw = yawToward(holdPos.x, holdPos.z);

      targetOpen = 0.4;
      placeHeld(h);
      // тем, что на буре, можно таранить других злюк

      for (const e of enemies) {
        if (e.dead || e.carried || e === h.ref || e.ramCd > 0) continue;
        const dx = e.pos.x - holdPos.x, dz = e.pos.z - holdPos.z, dd = Math.hypot(dx, dz) || 1e-4;
        if (dd < e.r + h.r) {
          e.ramCd = 0.4;
          hitEnemy(e, tmp.set(dx / dd, 0, dz / dd), sp > 6 ? 1.5 : 0.5, 6 + sp * 0.6);
          spawnParticles(tmp.copy(e.pos).setY(1), 0xffd27a, 4, 6); SFX.play('hit_flesh', e.pos);
          shake = Math.max(shake, 0.25);
        }
      }
      if (!want && grab.held) { throwHeld(car.alive ? groundAim : null); grab.state = 'retract'; }
    }

    // маркер цели
    const showT = grab.state === 'reach' && grab.target ? grab.target : (grab.state === 'idle' ? cand : null);
    targetMarker.visible = !!showT;
    if (showT) {
      const p = tgtPos(showT);
      targetMarker.position.set(p.x, showT.s + 1.3 + Math.sin(elapsed * 6) * 0.15, p.z);
      targetMarker.rotation.y += dt * 4;
    }

    let dy = aimYaw - grab.yaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy));
    grab.yaw += dy * Math.min(1, 18 * dt);
    arm.rotation.y = grab.yaw;
    grab.open += (targetOpen - grab.open) * Math.min(1, 14 * dt);
    armSeg.scale.x = grab.len;
    claw.position.x = -grab.len;
    for (const f of fingers) f.piv.rotation.y = f.side * grab.open;

    // летящие объекты
    for (let i = thrown.length - 1; i >= 0; i--) {

  function toggleBurrow() {

  function updateBurrow(dt) {

  const SKID_SLIP = 2.6, SKID_LIFE = 6, SKID_MAX = 360;

  function updateSkid(dt, lateral) {

      const strength = Math.min(1, (slip - SKID_SLIP) / 8);
      for (const w of [wheels[2], wheels[3]]) {        // задние колёса
        w.pivot.getWorldPosition(wpos);
        let sk = skids[skidHead];
        if (!sk) { sk = { m: new THREE.Mesh(skidGeo, new THREE.MeshBasicMaterial({ color: 0x1c1c1a, transparent: true, depthWrite: false })), t: 0 }; scene.add(sk.m); skids[skidHead] = sk; }
        sk.m.position.set(wpos.x, 0.02 + skidHead * 0.00001, wpos.z);
        sk.m.rotation.y = yaw; sk.t = SKID_LIFE; sk.a = 0.25 + 0.35 * strength;
        sk.m.material.opacity = sk.a; sk.m.visible = true;

        }

    }
  }

  const BOMB = { r: [7, 9, 11], T: [2, 3, 4], cd: [12, 11, 10] };
  let bombCd = 0; const domes = [];
  const domeGeo = new THREE.SphereGeometry(1, 36, 14, 0, Math.PI * 2, 0, Math.PI / 2), domeRingGeo = new THREE.RingGeometry(0.95, 1, 64); domeRingGeo.rotateX(-Math.PI / 2);

  function addDome(x, z, r, T) {

    const rmat = glow(new THREE.MeshBasicMaterial({ color: 0xffc4ef, transparent: true, opacity: 0, depthWrite: false }), 2.5);

          if (d < R) { m.pos.x = D.x + dx / d * R; m.pos.z = D.z + dz / d * R; const vn = m.vel.x * dx / d + m.vel.z * dz / d; if (vn < 0) { m.vel.x -= dx / d * vn; m.vel.z -= dz / d * vn; } } }

  const JUMP_V = 15, CAR_G = 32;                    // ~0.95 с в воздухе, высота ~3.5 — перелетает ящики и злюк
  function jump() {
    if (!car.alive || car.burrow !== 'up') return;
    if (!car.airborne) {
      if (!abilities.jump) return;
      car.vy = JUMP_V; car.airborne = true; car.usedDouble = false; car.airJumps = 0; SFX.play('jump', car.pos); crewSay('jump', 0.5);
      if (ride === 'spider' && SPD.n.y < 0.5) { car.vel.addScaledVector(SPD.n, 10); car.vy *= 0.6; }      // kick off the wall
      spawnParticles(tmp.copy(car.pos).setY(0.2), 0x8a8a78, 8, 5);
    } else if (abilities.doubleJump && !car.usedDouble) {   // второй толчок прямо в воздухе (the angel's; an upgrade adds a third)
      car.vy = JUMP_V * 0.95; car.airJumps = (car.airJumps || 0) + 1; if (car.airJumps >= 1 + (abLv.doubleJump >= 1 ? 1 : 0)) car.usedDouble = true; SFX.play('jump2', car.pos);

  function updateJump(dt) {
    if (!car.airborne) return;
    car.vy -= CAR_G * dt;
    car.y += car.vy * dt;
    if (car.y > (car.ground || 0)) return;
    // приземление
    const impact = -car.vy;
    car.y = car.ground || 0; car.vy = 0; car.airborne = false;
    shake = Math.max(shake, 0.25 + impact * 0.02);
    SFX.play('land', car.pos, { vol: Math.min(1, 0.4 + impact / 25) });
    spawnParticles(tmp.copy(car.pos).setY(0.2), 0x8a8a78, 14, 7); burst(tmp.setY(0.4), 0x9a8f7c, 9, 1.5, 5, 0.3);
    const popped = car.popped; car.popped = false;
    cartKick(3.5);
    if (!popped) for (const e of enemies) {          // приземлились на злюку — придавили
      if (e.dead || e.carried) continue;
      const dx = e.pos.x - car.pos.x, dz = e.pos.z - car.pos.z, d = Math.hypot(dx, dz) || 1e-4;
      if (d < car.radius + e.r * 0.8) {

        e.stun = 0.8;
        spawnParticles(tmp.copy(e.pos).setY(1), 0xc8323c, 6, 7);
      }
    }
    if (!popped) for (const m of swarm) {            // flat critters get flattened
      if (m.dead || m.K.fly) continue;
      const dx = m.pos.x - car.pos.x, dz = m.pos.z - car.pos.z, d = Math.hypot(dx, dz) || 1e-4;
      if (d < car.radius + m.r + 0.8 + (abLv.jump >= 1 ? 1.6 : 0)) hitCritter(m, m.K.heavy ? 3 : 99, tmp.set(dx / d, 0, dz / d), 10);
    }
    if (!popped && abLv.jump >= 2 && impact > 8) ringBlast(car.pos.x, car.pos.z, 6.5, 2, 16, 0xffe08a, true);      // landing shockwave
    for (const o of obstacles) {                     // и на ящик — в щепки

      const p = o.mesh.position;
      const cx = THREE.MathUtils.clamp(car.pos.x, p.x - o.hx, p.x + o.hx);
      const cz = THREE.MathUtils.clamp(car.pos.z, p.z - o.hz, p.z + o.hz);
      if (Math.hypot(car.pos.x - cx, car.pos.z - cz) < car.radius) damageCrate(o, 99);
    }
  }

// ---------- shared parts ----------
function tentPts(x, y, len, ang, ph, { seg = 12, amp = 0.5, freq = 1.6, curl = 0 } = {}) {
  const pts = [[x, y]], st = len / seg; let px = x, py = y;
  for (let i = 1; i <= seg; i++) {
    const s = i / seg, a = ang + curl * s * s + amp * Math.sin(ph * TAU - s * freq * Math.PI) * s;
    px += Math.cos(a) * st; py += Math.sin(a) * st; pts.push([px, py]);
  }

}
function tentacle(c, pts, w0, w1, fill, suck) {
  const n = pts.length, L = [], R = [];
  for (let i = 0; i < n; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    let dx = b[0] - a[0], dy = b[1] - a[1]; const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
    const w = (w0 + (w1 - w0) * i / (n - 1)) / 2;
    L.push([pts[i][0] - dy * w, pts[i][1] + dx * w]); R.push([pts[i][0] + dy * w, pts[i][1] - dx * w]);
  }
  c.beginPath(); c.moveTo(L[0][0], L[0][1]);
  for (let i = 1; i < n; i++) c.lineTo(L[i][0], L[i][1]);
  const t = pts[n - 1]; c.arc(t[0], t[1], w1 / 2, Math.atan2(L[n - 1][1] - t[1], L[n - 1][0] - t[0]), Math.atan2(R[n - 1][1] - t[1], R[n - 1][0] - t[0]), true);
  for (let i = n - 1; i >= 0; i--) c.lineTo(R[i][0], R[i][1]);
  c.closePath(); c.fillStyle = fill; c.fill(); c.stroke();
  if (suck) {
    c.fillStyle = suck;

      const w = (w0 + (w1 - w0) * i / (n - 1));

function eye(c, x, y, r, o = {}) {
