<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Car Proto — isometric</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1d22; font-family: system-ui, sans-serif;
               touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; cursor: crosshair; touch-action: none; }
  #hud { position: fixed; left: 16px; top: 14px; color: #e8e6e1; font-size: 13px; line-height: 1.5; pointer-events: none; user-select: none; }
  #tasks { background: rgba(20,22,26,.42); padding: 8px 12px; border-radius: 8px; min-width: 190px; }
  #tasks .ph { font-weight: 800; color: #ffd27a; letter-spacing: .04em; font-size: 14px; }
  #tasks .sub { opacity: .7; font-size: 11px; margin-bottom: 4px; }
  #tasks .tk { display: flex; gap: 6px; align-items: baseline; }
  #tasks .tk i { font-style: normal; width: 14px; display: inline-block; color: #9a9590; }
  #tasks .tk.done { opacity: .55; text-decoration: line-through; } #tasks .tk.done i { color: #9cf59a; }
  #tasks .tk em { font-style: normal; color: #ffb347; margin-left: auto; padding-left: 10px; }
  #net { color: #9cf59a; display: block; font-size: 11px; margin-top: 4px; text-shadow: 0 1px 2px #000; }
  #phcard { position: fixed; left: 50%; top: 8%; transform: translateX(-50%) scale(.9); text-align: center; pointer-events: none; opacity: 0; z-index: 7;
             transition: opacity .35s, transform .35s; color: #f6e2be; text-shadow: 0 3px 0 #000, 0 0 18px rgba(0,0,0,.6); white-space: nowrap; }
  #phcard.on { opacity: 1; transform: translateX(-50%) scale(1); }
  #phcard .pn { font: 800 14px system-ui, sans-serif; letter-spacing: .3em; color: #ffb347; }
  #phcard .nm { font: 900 clamp(26px, 4.3vw, 54px)/1.05 system-ui, sans-serif; letter-spacing: .02em; color: #ff8a3a; -webkit-text-stroke: 2px #1b1421; }
  #phcard .ds { font: 600 17px system-ui, sans-serif; margin-top: 6px; }
  #phcard .cd { font: 800 22px system-ui, sans-serif; margin-top: 10px; color: #9cf59a; }
  body.touch #phcard .nm { font-size: 32px; } body.touch #phcard .ds { font-size: 12px; } body.touch #phcard .cd { font-size: 15px; }
  #minimap { position: fixed; right: 14px; bottom: 14px; width: 200px; height: 200px; pointer-events: none; z-index: 4; }
  body.touch #minimap { right: 8px; top: 50px; bottom: auto; width: 116px; height: 116px; }
  body.touch #tasks { min-width: 0; padding: 5px 8px; font-size: 10px; } body.touch #tasks .ph { font-size: 11px; } body.touch #tasks .sub { display: none; }
  #hud b { color: #ffb347; font-weight: 600; }
  #speed { position: fixed; right: 18px; bottom: 14px; color: #e8e6e1; font: 600 28px/1 ui-monospace, monospace;
           background: rgba(20,22,26,.72); padding: 10px 14px; border-radius: 8px; pointer-events: none; }
  #speed small { font-size: 12px; opacity: .6; margin-left: 4px; }
  #hp { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); width: 260px; height: 14px;
        background: rgba(20,22,26,.72); border-radius: 7px; padding: 3px; pointer-events: none; }
  #hpfill { height: 100%; width: 100%; background: #5fd36a; border-radius: 5px; transition: width .12s, background .2s; }
  #dead { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; pointer-events: none;
          color: #ff5a5a; font: 800 44px/1 system-ui, sans-serif; text-shadow: 0 3px 0 #000; letter-spacing: 1px; }
  #abilities { position: fixed; left: 16px; bottom: 14px; display: flex; gap: 8px; pointer-events: none; }
  #weapons { position: fixed; left: 16px; bottom: 90px; display: flex; gap: 6px; pointer-events: none; }
  .wslot { width: 40px; text-align: center; background: rgba(20,22,26,.72); border-radius: 8px; padding: 4px 3px 3px; animation: pop .5s ease-out; }
  .wslot img { width: 34px; height: 34px; display: block; margin: 0 auto 2px; border-radius: 7px; }
  .wslot b { color: #ffd27a; font: 800 10px/1 system-ui, sans-serif; }
  body.touch #weapons { left: 8px; top: 74px; bottom: auto; }
  body.touch .wslot { width: 32px; padding: 3px 2px 2px; }
  body.touch .wslot img { width: 28px; height: 28px; }
  .ab { width: 56px; text-align: center; color: #e8e6e1; font: 600 11px/1.2 system-ui, sans-serif;
        background: rgba(20,22,26,.72); border-radius: 8px; padding: 5px 4px 4px; transition: opacity .3s, filter .3s; }
  .ab img { width: 44px; height: 44px; display: block; margin: 0 auto 3px; border-radius: 8px; }
  .ab.locked { opacity: .28; filter: grayscale(1); }
  .ab.fresh { animation: pop .6s ease-out; }
  @keyframes pop { 0% { transform: scale(1.6); } 100% { transform: scale(1); } }
  #toast { position: fixed; left: 50%; top: 18%; transform: translateX(-50%); display: flex; align-items: center; gap: 12px;
           background: rgba(20,22,26,.85); color: #fff; padding: 10px 18px 10px 10px; border-radius: 12px;
           font: 700 18px/1.2 system-ui, sans-serif; pointer-events: none; opacity: 0; transition: opacity .25s; }
  #toast img { width: 48px; height: 48px; border-radius: 8px; }
  #toast small { display: block; font-weight: 500; font-size: 13px; opacity: .75; margin-top: 2px; }
  .hint { position: fixed; left: 0; top: 0; width: 44px; height: 44px; margin: -22px 0 0 -22px; pointer-events: none; z-index: 4; opacity: 0; will-change: transform, opacity; }
  .hint i { position: absolute; inset: 0; }
  .hint i::before { content: ''; position: absolute; left: 50%; top: -9px; margin-left: -8px; border: 8px solid transparent; border-top: 0; border-bottom: 11px solid var(--c); }
  .hint b { position: absolute; inset: 4px; border-radius: 50%; background: rgba(20,22,26,.8); border: 2px solid var(--c); color: var(--c);
            font: 700 12px/32px system-ui, sans-serif; text-align: center; white-space: nowrap; }
  .hint u { position: absolute; top: 46px; text-decoration: none; white-space: nowrap; padding: 1px 7px; border-radius: 6px; background: rgba(20,22,26,.8); color: var(--c); font: 700 11px/16px system-ui, sans-serif; letter-spacing: .03em; text-transform: uppercase; }
  #alert { position: fixed; left: 50%; top: 37%; transform: translateX(-50%); pointer-events: none; opacity: 0;
           color: #ffb347; font: 800 34px/1 system-ui, sans-serif; text-shadow: 0 3px 0 #000; transition: opacity .3s; }
  #bossbar { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); width: 420px; display: none; pointer-events: none;
             text-align: center; color: #ff8fc8; font: 800 15px/1 system-ui, sans-serif; letter-spacing: 3px; text-shadow: 0 2px 0 #000; }
  #bosshp { margin-top: 6px; height: 14px; background: rgba(20,22,26,.8); border-radius: 7px; padding: 3px; }
  #bossfill { height: 100%; width: 100%; background: linear-gradient(90deg, #d040a0, #ff5a8a); border-radius: 5px; transition: width .1s; }
  /* ---- touch layout: two floating sticks, ability buttons in an arc around the right thumb ---- */
  .tc { display: none; }
  .stick { position: fixed; width: 124px; height: 124px; margin: -62px 0 0 -62px; border-radius: 50%; display: none; pointer-events: none;
           border: 2px solid rgba(255,255,255,.22); background: rgba(255,255,255,.05); opacity: .4; transition: opacity .15s; }
  .stick i { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(255,255,255,.32); }
  .stick.on { opacity: 1; }
  #stickR i { background: rgba(255,140,50,.6); }
  body.touch .stick { display: block; }
  body.touch .kb { display: none; }
  body.touch .tc { display: inline; }
  body.touch #hud { left: 8px; top: 8px; font-size: 11px; line-height: 1.45; padding: 6px 9px; max-width: 46vw; }
  body.touch #speed { right: 8px; top: 8px; bottom: auto; font-size: 16px; padding: 6px 9px; }
  body.touch #speed small { font-size: 10px; }
  body.touch #hp { width: min(240px, 30vw); bottom: 12px; }
  body.touch #bossbar { width: min(420px, 60vw); top: 50px; }
  body.touch #toast { font-size: 14px; top: 22%; width: max-content; max-width: 84vw; }
  body.touch #alert { font-size: 24px; white-space: nowrap; }
  body.touch #abilities { left: auto; right: 0; bottom: 0; width: 0; height: 0; display: block; }
  body.touch .ab { position: absolute; width: 58px; height: 58px; padding: 0; border-radius: 50%; overflow: hidden; box-sizing: border-box;
                   pointer-events: auto; border: 2px solid rgba(255,255,255,.4); background: rgba(20,22,26,.6); }
  body.touch .ab img { width: 100%; height: 100%; margin: 0; border-radius: 50%; }
  body.touch .ab span { display: none; }
  body.touch .ab.locked { pointer-events: none; opacity: .2; }
  body.touch .ab.down { transform: scale(.9); filter: brightness(1.5); }
  body.touch #ab-doubleJump { width: 30px; height: 30px; border-width: 1px; pointer-events: none; }
  #mute { position: fixed; right: 16px; top: 14px; width: 40px; height: 40px; border-radius: 8px; border: 0; cursor: pointer;
          background: rgba(20,22,26,.72); color: #e8e6e1; font-size: 18px; line-height: 40px; padding: 0; z-index: 5; }
  #mute.off { opacity: .55; }
  #volBox { position: fixed; right: 16px; top: 60px; z-index: 6; display: none; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; background: rgba(20,22,26,.86); color: #e8e6e1; font-size: 15px; }
  #volBox.on { display: flex; }
  #volBox input { width: 150px; accent-color: #ffb040; }
  #volBox button { border: 0; background: none; color: inherit; font-size: 18px; cursor: pointer; padding: 2px 4px; }
  body.touch #volBox { top: 48px; right: 8px; }
  #restart { position: fixed; right: 64px; top: 14px; min-width: 40px; height: 40px; border-radius: 8px; border: 0; cursor: pointer; background: rgba(20,22,26,.72); color: #e8e6e1;
             font: 700 18px/40px system-ui, sans-serif; padding: 0 10px; z-index: 5; }
  #restart.ask { background: #c2264a; color: #fff; font-size: 13px; }
  body.touch #restart { top: 8px; right: 144px; min-width: 34px; height: 34px; font-size: 15px; line-height: 34px; }
  body.touch #restart.ask { font-size: 12px; }
  body.touch #mute { top: 8px; right: 104px; width: 34px; height: 34px; font-size: 15px; line-height: 34px; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
           background: rgba(12,10,16,.9); color: #fff; font-size: 18px; cursor: pointer; z-index: 20; padding: 10px; box-sizing: border-box; }
  #rides { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; opacity: 0; animation: panelIn .4s 2.3s forwards; }
  #rides em { font-style: normal; font-size: 14px; opacity: .7; margin-right: 4px; }
  #rides button { background: #ff8c32; color: #1b1d22; padding: 10px 16px; border-radius: 8px; border: 0; font: 800 15px system-ui, sans-serif; cursor: pointer; }
  #rides button.last { outline: 3px solid #fffdf4; }
  #lobbyStep { display: flex; flex-direction: column; align-items: center; gap: 12px; width: min(460px, 92vw); max-height: 100%; overflow: auto; cursor: default;
               background: rgba(26,22,34,.92); border: 2px solid #4a4458; border-radius: 16px; padding: 18px 20px; box-sizing: border-box; font-size: 14px; color: #cfc8dc; }
  #lobbyStep { width: min(600px, 94vw) !important; }
  #how { display: flex; gap: 6px; justify-content: center; align-items: flex-start; width: 100%; }
  #how div { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 5px; font: 700 11px/1.2 system-ui, sans-serif; letter-spacing: .03em; text-transform: uppercase; color: #ffd27a; text-align: center; }
  #how canvas { width: 100%; max-width: 92px; aspect-ratio: 1; border-radius: 10px; background: #2a2433; border: 1px solid #4a4458; }
  #how div span { color: #8d8799; font-weight: 800; }
  #lobbyStep h1 { margin: 0; font: 900 26px Impact, "Arial Black", system-ui, sans-serif; letter-spacing: 2px; color: #ff8c32; }
  #lobbyStep input { width: 140px; margin-left: 6px; background: #221d2b; border: 1px solid #4a4458; color: #fff; border-radius: 6px; padding: 7px 9px; font: 600 15px system-ui, sans-serif; }
  #mpState { text-align: center; line-height: 1.4; }
  #mpList { display: flex; flex-direction: column; gap: 7px; width: 100%; }
  #mpList button { background: #2b5fd0; color: #fff; border: 0; border-radius: 9px; padding: 12px 14px; font: 700 15px system-ui, sans-serif; cursor: pointer; text-align: left; }
  #mpList button::after { content: 'JOIN ›'; float: right; opacity: .85; }
  #lobbyBtns { display: flex; gap: 8px; width: 100%; }
  #lobbyBtns button { flex: 1; border: 0; border-radius: 9px; padding: 12px 8px; font: 800 14px system-ui, sans-serif; cursor: pointer; background: #ff8c32; color: #1b1d22; }
  #lobbyBtns #soloBtn { background: #3a3642; color: #e8e6e1; }
  #comicStep { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  #lobbyTag { font-size: 13px; color: #9cf59a; min-height: 16px; }
  #asc { position: fixed; left: 50%; top: 16%; transform: translateX(-50%); display: none; z-index: 8; pointer-events: none; color: #bfe4ff;
         font: 900 84px Impact, "Arial Black", system-ui, sans-serif; text-shadow: 0 4px 0 #14233f, 0 0 30px rgba(120,190,255,.8); }
  #results { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); display: none; z-index: 30; width: min(420px, 88vw); max-height: 92vh; overflow: auto; box-sizing: border-box;
             background: rgba(14,18,34,.94); border: 3px solid #7fc0ff; border-radius: 16px; padding: 18px 22px; color: #e8f2ff; text-align: center; font: 15px/1.5 system-ui, sans-serif; }
  #results h2 { margin: 0; font-size: 18px; letter-spacing: 1px; color: #ffe07a; }
  #results .big { font: 900 76px/1 Impact, "Arial Black", system-ui, sans-serif; color: #7fc0ff; margin-top: 6px; }
  #results .sub { opacity: .7; margin-bottom: 10px; }
  #results table { width: 100%; border-collapse: collapse; text-align: left; }
  #results td { padding: 3px 0; border-top: 1px solid rgba(127,192,255,.2); } #results td:last-child { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  #results p { margin: 12px 0; font-style: italic; opacity: .9; }
  #results button { background: #7fc0ff; color: #0e1222; border: 0; border-radius: 8px; padding: 10px 22px; font: 800 15px system-ui, sans-serif; cursor: pointer; }
  #comic { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: min(96vw, calc((100vh - 110px) * 1.6), 1040px); }
  #comic canvas { width: 100%; display: block; border: 3px solid #fffdf4; border-radius: 4px; box-sizing: border-box; opacity: 0;
                  animation: panelIn .45s cubic-bezier(.2,1.4,.4,1) forwards; }
  #comic canvas:nth-child(1) { animation-delay: .15s; } #comic canvas:nth-child(2) { animation-delay: .75s; }
  #comic canvas:nth-child(3) { animation-delay: 1.35s; } #comic canvas:nth-child(4) { animation-delay: 1.95s; }
  @keyframes panelIn { from { opacity: 0; transform: scale(.88) rotate(-2deg); } to { opacity: 1; transform: none; } }
  @media (max-aspect-ratio: 1/1) { #comic { grid-template-columns: 1fr; width: min(92vw, calc((100vh - 110px) * .4)); gap: 6px; } }
  #unload { position: fixed; display: none; transform: translate(-50%, -100%); z-index: 6; cursor: pointer; border: 3px solid #1b1421; border-radius: 12px;
            background: #5fd0ff; color: #1b1421; font: 800 16px system-ui, sans-serif; padding: 9px 16px; box-shadow: 0 3px 0 #1b1421, 0 6px 14px rgba(0,0,0,.5);
            animation: unloadPulse .8s ease-in-out infinite alternate; touch-action: none; }
  @keyframes unloadPulse { from { filter: brightness(1); } to { filter: brightness(1.25); } }
  body.touch #unload { font-size: 18px; padding: 12px 20px; } body.touch #unload small { display: none; }
  #altT { position: fixed; display: none; transform: translate(-50%, -100%); z-index: 5; pointer-events: none; white-space: nowrap;
          background: rgba(20,22,26,.78); color: #ff8fa0; font: 700 13px ui-monospace, Menlo, monospace; padding: 3px 9px; border-radius: 7px; }
  #altT.soon { color: #fff; background: #c2264a; }
  #crew { position: fixed; left: 16px; top: 184px; display: flex; flex-direction: column; gap: 8px; pointer-events: none; z-index: 4; }
  .say { display: flex; align-items: center; gap: 10px; animation: sayIn .28s cubic-bezier(.2,1.6,.4,1); transition: opacity .35s, transform .35s; }
  .say.out { opacity: 0; transform: translateX(-12px); }
  .say i { width: 56px; height: 56px; flex: none; border-radius: 50%; background-size: cover; border: 3px solid #ff8c32; box-shadow: 0 2px 8px rgba(0,0,0,.5); }
  .say.vee i { border-color: #5ff5e6; }
  .say b { position: relative; background: #fffdf4; color: #1b1421; border: 2.5px solid #1b1421; border-radius: 14px; padding: 6px 12px; max-width: 230px;
           font: 700 14px/1.25 "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif; }
  .say b::before { content: ''; position: absolute; left: -9px; top: 50%; margin-top: -6px; border: 6px solid transparent; border-right-color: #1b1421; border-left: 0; }
  .say em { font-style: normal; font-size: 17px; margin-right: 5px; }
  @keyframes sayIn { from { opacity: 0; transform: scale(.6) translateX(-20px); } to { opacity: 1; transform: none; } }
  body.touch #crew { left: 8px; top: 84px; gap: 5px; }
  body.touch .say i { width: 40px; height: 40px; border-width: 2px; }
  body.touch .say b { font-size: 12px; padding: 4px 9px; max-width: 42vw; }
  body.touch .say em { font-size: 14px; }
</style>
</head>
<body>
<div id="hud">
  <div id="tasks"></div>
  <span id="net"></span>
  <div style="display:none">
  <span class="kb"></span><span class="tc"></span>
  Crates: <span id="kills">0</span> · Biters: <span id="ekills">0</span>
  Chubziks alive: <b id="aliveN">0</b> · in cart: <b id="cartN">0</b> · eaten: <span id="eatN">0</span>
  Altars: <b id="altN">0/5 · 0/5 · 0/5</b>
  </div>
</div>
<canvas id="minimap"></canvas>
<div id="phcard"><div class="pn"></div><div class="nm"></div><div class="ds"></div><div class="cd"></div></div>
<div id="abilities"></div>
<div id="weapons"></div>
<div id="toast"></div>
<div id="hp"><div id="hpfill"></div></div>
<div id="dead">DEVOURED</div>
<div id="alert"></div>
<div id="diag" style="display:none;position:fixed;left:50%;top:26px;transform:translateX(-50%);z-index:31;width:min(96vw,760px);max-height:70vh;overflow:auto;background:rgba(14,15,19,.93);color:#dcd9d2;font:11px/1.45 ui-monospace,Menlo,Consolas,monospace;border-radius:8px;padding:8px 10px;box-sizing:border-box">
  <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><b style="color:#ffd27a">Lobby diagnostics</b><span style="opacity:.6">L or tap the build tag</span><span style="flex:1"></span><button id="diagCopy" style="font:inherit;padding:2px 8px">copy all</button><button id="diagClose" style="font:inherit;padding:2px 8px">×</button></div>
  <table id="diagT" style="border-collapse:collapse;width:100%;margin-bottom:6px"></table><div id="diagL" style="white-space:pre-wrap;word-break:break-word"></div></div>
<div id="build" style="position:fixed;left:50%;top:4px;transform:translateX(-50%);font:700 12px system-ui,sans-serif;color:#ffd27a;background:rgba(20,22,26,.8);padding:2px 8px;border-radius:6px;pointer-events:none;z-index:30;white-space:nowrap"></div>
<div id="bossbar"><div id="bossname">PYRAMIDON</div><div id="bosshp"><div id="bossfill"></div></div></div>
<div id="speed" style="display:none"><span id="spd">0</span><small>km/h</small></div>
<button id="mute" title="Volume (M mutes)">🔊</button>
<div id="volBox"><button id="volDown" title="Quieter">−</button><input id="vol" type="range" min="0" max="100" step="5"><button id="volUp" title="Louder">+</button></div>
<button id="restart" title="Restart: back to the comic and ride choice">⟲</button>
<div class="stick" id="stickL"><i></i></div>
<div class="stick" id="stickR"><i></i></div>
<div id="crew"></div>
<button id="unload" tabindex="-1">SACRIFICE! <small style="opacity:.7">E</small></button>
<div id="altT"></div>
<div id="start">
  <div id="lobbyStep">
    <h1>CAR PROTO</h1>
    <div id="how"></div>
    <label>Your name <input id="nick" maxlength="12" autocomplete="off" spellcheck="false"></label>
    <div id="mpState">Multiplayer: connecting…</div>
    <div id="mpList"></div>
    <div id="lobbyBtns"><button id="hostBtn">HOST A LOBBY</button><button id="soloBtn">PLAY SOLO</button></div>
  </div>
  <div id="comicStep" style="display:none"><div id="comic"></div><div id="rides"><em>Pick a ride</em><button data-ride="buggy">🚙 BUGGY</button><button data-ride="spider">🕷️ SPIDER</button><button data-ride="halo">👁️ HALO</button><button data-ride="unicorn">🦄 UNICORN</button></div><div id="lobbyTag"></div></div>
</div>
<div id="asc"></div>
<div id="results"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/FXAAShader.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(() => {
  // ---------- colour pipeline ----------
  // Colours are authored in sRGB (hex), lit in linear HDR, then tone-mapped and encoded in the final post pass.
  {
    const C = THREE.Color.prototype, setHex = C.setHex, setStyle = C.setStyle, setHSL = C.setHSL, getHex = C.getHex;
    const scratch = new THREE.Color();
    C.setHex = function (h) { return setHex.call(this, h).convertSRGBToLinear(); };
    C.setStyle = function (st) { return setStyle.call(this, st).convertSRGBToLinear(); };
    C.setHSL = function (h, sat, l) { return setHSL.call(this, h, sat, l).convertSRGBToLinear(); };
    C.getHex = function () { return getHex.call(scratch.copy(this).convertLinearToSRGB()); };
  }
  const srgbTex = c => { const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t; };
  const glow = (mat, k) => { mat.color.multiplyScalar(k); return mat; };   // push an unlit colour into HDR so it blooms

  // ---------- renderer / scene ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  const COARSE = matchMedia('(pointer: coarse)').matches;      // phone / tablet
  let PR = Math.min(devicePixelRatio, COARSE ? 1.5 : 2);
  renderer.setPixelRatio(PR);
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = COARSE ? THREE.PCFShadowMap : THREE.PCFSoftShadowMap;
  renderer.shadowMap.autoUpdate = false;                // refreshed from frame(): every frame on desktop, every 2nd-3rd on phones
  let shadowEvery = COARSE ? 2 : 1, shadowTick = 0, bloomPass = null;
  document.body.appendChild(renderer.domElement);
  const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x14121c);
  scene.fog = new THREE.Fog(0x241d30, 88, 190);

  // ---------- isometric camera ----------
  let viewSize = COARSE ? 15 : 18;       // half-height of ortho frustum in world units
  const ISO_OFFSET = new THREE.Vector3(30, 30, 30); // classic 45°/35° iso
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 300);
  function resizeCam() {
    const a = innerWidth / innerHeight, v = Math.max(viewSize, 11 / a);   // portrait: never show less than 22 units across
    camera.left = -v * a; camera.right = v * a;
    camera.top = v; camera.bottom = -v;
    camera.updateProjectionMatrix();
  }
  resizeCam();
  const camFocus = new THREE.Vector3();

  // ---------- lights: low warm sun, cool sky fill, blue rim ----------
  const SUN_OFFSET = new THREE.Vector3(-36, 25, 15);
  scene.add(new THREE.HemisphereLight(0xa6b0e6, 0x33262a, 0.17));
  const sun = new THREE.DirectionalLight(0xffc091, 1.35);
  sun.castShadow = true;
  sun.shadow.mapSize.set(COARSE ? 1024 : 2048, COARSE ? 1024 : 2048);
  Object.assign(sun.shadow.camera, { left: -48, right: 48, top: 48, bottom: -48, near: 1, far: 140 });
  sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.04;
  scene.add(sun, sun.target);
  const rim = new THREE.DirectionalLight(0x7088ff, 0.09);
  rim.position.set(30, 20, -28); scene.add(rim);

  // image-based lighting: a small sunset sky rendered once into a PMREM so paint, glass and puddles have something to reflect
  {
    const envScene = new THREE.Scene();
    const geo = new THREE.SphereGeometry(50, 48, 24);
    const pos = geo.attributes.position, col = new Float32Array(pos.count * 3);
    const sd = new THREE.Vector3(-1, 0, -0.75).normalize(), v = new THREE.Vector3(), flat = new THREE.Vector3();   // the iso camera mirrors toward (-1, +y, -1)
    const zen = [0.045, 0.055, 0.12], gnd = [0.02, 0.018, 0.026];
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i).normalize();
      const toward = Math.pow(Math.max(0, flat.set(v.x, 0, v.z).normalize().dot(sd)), 1.5);
      const hor = [0.2 + 0.95 * toward, 0.12 + 0.3 * toward, 0.2 - 0.05 * toward];
      let c;
      if (v.y >= 0) { const k = Math.pow(v.y, 0.45 + 1.3 * toward); c = hor.map((h, j) => h + (zen[j] - h) * k); }
      else { const k = Math.min(1, -v.y * 4); c = hor.map((h, j) => h * 0.4 + (gnd[j] - h * 0.4) * k); }
      col[i * 3] = c[0]; col[i * 3 + 1] = c[1]; col[i * 3 + 2] = c[2];
    }
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    envScene.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
    const disc = new THREE.Mesh(new THREE.SphereGeometry(5, 16, 12), new THREE.MeshBasicMaterial());
    disc.material.color.setRGB(16, 8, 3); disc.position.copy(SUN_OFFSET).normalize().multiplyScalar(40); envScene.add(disc);
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(envScene, 0.03).texture;
    pmrem.dispose();
  }

  // ---------- post-processing: HDR bloom -> filmic grade -> FXAA ----------
  let composer = null, gradePass = null, fxaaPass = null;
  if (THREE.EffectComposer && THREE.RenderPass && THREE.ShaderPass && THREE.UnrealBloomPass) {
    const hdr = !!(renderer.capabilities.isWebGL2 && renderer.extensions.get('EXT_color_buffer_float')) ||
                !!renderer.extensions.get('EXT_color_buffer_half_float');      // iOS exposes only the half-float one
    const rt = new THREE.WebGLRenderTarget(4, 4, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
      format: THREE.RGBAFormat, type: hdr ? THREE.HalfFloatType : THREE.UnsignedByteType });
    composer = new THREE.EffectComposer(renderer, rt);
    composer.setPixelRatio(PR); composer.setSize(innerWidth, innerHeight);
    composer.addPass(new THREE.RenderPass(scene, camera));
    const bloom = new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.36, 0.55, hdr ? 1.15 : 0.86);
    bloomPass = bloom;
    try { const hp = bloom.materialHighPassFilter;
      hp.fragmentShader = hp.fragmentShader.replace('vec4 texel = texture2D( tDiffuse, vUv );', 'vec4 texel = texture2D( tDiffuse, vUv ); texel.rgb = min(max(texel.rgb, vec3(0.0)), vec3(40.0));');
      hp.needsUpdate = true; } catch (e) {}
    { const ss = bloom.setSize.bind(bloom), k = COARSE ? 0.5 : 0.75; bloom.setSize = (w, h) => ss(Math.round(w * k), Math.round(h * k)); bloom.setSize(innerWidth * PR, innerHeight * PR); }   // blur chain on a smaller buffer
    if (hdr) [bloom.renderTargetBright, ...bloom.renderTargetsHorizontal, ...bloom.renderTargetsVertical]
      .forEach(t => { t.texture.type = THREE.HalfFloatType; });
    composer.addPass(bloom);
    gradePass = new THREE.ShaderPass({
      uniforms: { tDiffuse: { value: null }, time: { value: 0 }, exposure: { value: 2.0 }, hurt: { value: 0 }, lowHp: { value: 0 } },
      vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
      fragmentShader: `
        uniform sampler2D tDiffuse; uniform float time, exposure, hurt, lowHp; varying vec2 vUv;
        vec3 aces(vec3 x){ return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }
        void main(){
          vec2 d = vUv - 0.5; float r2 = dot(d, d);
          vec2 ca = d * r2 * 0.006;                                   // slight chromatic fringe toward the corners
          vec3 c = vec3(texture2D(tDiffuse, vUv + ca).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv - ca).b);
          c = aces(c * exposure);
          float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
          c *= mix(vec3(0.94, 0.98, 1.08), vec3(1.05, 1.0, 0.94), smoothstep(0.0, 0.55, l));   // cool shadows, warm highlights
          c = mix(vec3(l), c, 1.14);                                  // saturation
          c = pow(max(c, 0.0), vec3(1.0 / 2.2));
          c *= 1.0 - 0.5 * smoothstep(0.12, 0.62, r2);                // vignette
          float edge = smoothstep(0.06, 0.45, r2);
          c = mix(c, vec3(0.75, 0.04, 0.04), edge * clamp(hurt * 0.55 + lowHp * (0.22 + 0.12 * sin(time * 6.0)), 0.0, 0.8));
          float n = fract(sin(dot(gl_FragCoord.xy + fract(time) * 91.0, vec2(12.9898, 78.233))) * 43758.5453);
          c += (n - 0.5) * 0.022;                                     // film grain
          gl_FragColor = vec4(c, 1.0);
        }` });
    composer.addPass(gradePass);
    if (THREE.FXAAShader) {
      fxaaPass = new THREE.ShaderPass(THREE.FXAAShader);
      fxaaPass.uniforms.resolution.value.set(1 / (innerWidth * PR), 1 / (innerHeight * PR));
      composer.addPass(fxaaPass);
    }
  } else {                                                           // post scripts failed to load: plain render, still tone-mapped
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 2.2;
  }

  // ---------- FX: soft sprites, additive flashes, pooled lights (light count never changes -> no shader recompiles) ----------
  const softTex = (() => {
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const x = c.getContext('2d'), g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.35, 'rgba(255,255,255,0.55)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = g; x.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(c);
  })();
  const puffs = [], flashes = [];
  const puffPool = [], flashPool = [];
  function fxSprite(pool, additive) {
    const m = pool.pop() || new THREE.Sprite(new THREE.SpriteMaterial({ map: softTex, transparent: true, depthWrite: false, blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending }));
    m.visible = true; if (!m.parent) scene.add(m); return m;
  }
  function puff(pos, color, size, life, vx, vy, vz, alpha = 0.45, grow = 1.6) {
    if (puffs.length > (COARSE ? 70 : 160)) return;
    const m = fxSprite(puffPool, false); m.material.color.set(color); m.material.opacity = alpha;
    m.position.copy(pos); m.scale.setScalar(size);
    puffs.push({ m, life, max: life, a: alpha, v: new THREE.Vector3(vx, vy, vz), grow });
  }
  function burst(pos, color, n, size, speed = 3, alpha = 0.4) {       // ring of dust/smoke
    if (COARSE) n = Math.ceil(n * 0.6);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = speed * (0.4 + Math.random() * 0.8);
      puff(pos, color, size * (0.7 + Math.random() * 0.6), 0.6 + Math.random() * 0.5, Math.cos(a) * sp, 0.6 + Math.random() * 1.2, Math.sin(a) * sp, alpha, 1.8);
    }
  }
  const fxLights = (COARSE ? [0] : [0, 1]).map(() => { const L = new THREE.PointLight(0xffffff, 0, 30, 2); L.userData = { life: 0, max: 1, i: 0 }; scene.add(L); return L; });
  let fxNext = 0;
  const muzzleLight = new THREE.PointLight(0xffb060, 0, 20, 2); scene.add(muzzleLight);
  let flashLightCd = 0;
  function flash(pos, color, size, life = 0.22, power = 3, light = true) {
    if (flashes.length > 40) return;
    life *= 1.35;                                          // slower bloom-and-fade instead of a strobe pop
    const m = fxSprite(flashPool, true), c = m.material.color.set(color);
    c.multiplyScalar(0.45 + power * 0.3);
    const mx = Math.max(c.r, c.g, c.b); if (mx > 1) c.multiplyScalar(1 / mx);
    c.lerp(flashTint.set(color), 0.25);                    // keeps the hue: near-white pops were the harsh ones
    m.material.opacity = 0; m.position.copy(pos); m.scale.setScalar(size * 0.35);
    flashes.push({ m, life, max: life, size });
    if (light && flashLightCd <= 0) {
      flashLightCd = 0.25;
      const L = fxLights[fxNext]; fxNext = (fxNext + 1) % fxLights.length;
      L.color.set(color); L.position.copy(pos); L.position.y += 1.5;
      L.userData.life = L.userData.max = life * 1.8; L.userData.i = Math.min(1.3, size * 0.12);
    }
  }
  const flashTint = new THREE.Color();
  function updateFx(dt) {
    for (let i = puffs.length - 1; i >= 0; i--) {
      const p = puffs[i];
      p.life -= dt;
      p.m.position.addScaledVector(p.v, dt); p.v.multiplyScalar(Math.max(0, 1 - 1.8 * dt));
      p.m.scale.multiplyScalar(1 + p.grow * dt);
      p.m.material.opacity = Math.max(0, p.a * p.life / p.max);
      if (p.life <= 0) { p.m.visible = false; puffPool.push(p.m); puffs.splice(i, 1); }
    }
    for (let i = flashes.length - 1; i >= 0; i--) {
      const f = flashes[i];
      f.life -= dt;
      const k = 1 - Math.max(0, f.life / f.max);
      f.m.scale.setScalar(f.size * (0.35 + 0.65 * Math.sqrt(k)));
      f.m.material.opacity = Math.min(1, k * 7) * (1 - k * k) * 0.7;      // short ramp up: no single-frame pop
      if (f.life <= 0) { f.m.visible = false; flashPool.push(f.m); flashes.splice(i, 1); }
    }
    flashLightCd -= dt;
    for (const L of fxLights) {
      L.userData.life -= dt;
      const q = L.userData.life > 0 ? L.userData.life / L.userData.max : 0;
      L.intensity = L.userData.i * q * Math.min(1, (1 - q) * 6);
    }
    muzzleLight.intensity *= Math.max(0, 1 - 14 * dt);
  }

  // Pure DSP + recipes. No DOM, no THREE: the same source runs inside a Web Worker.
  function audioLib(SR) {
    // ---- DSP toolkit: everything works on Float32Arrays at SR ----
    function rng(seed) {                                   // mulberry32
      let a = seed >>> 0;
      return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    }
    const N = sec => new Float32Array(Math.max(1, Math.round(sec * SR)));
    function noise(sec, r, color = 'white') {
      const b = N(sec); let l = 0, p0 = 0, p1 = 0, p2 = 0;
      for (let i = 0; i < b.length; i++) {
        const w = r() * 2 - 1;
        if (color === 'brown') { l = (l + 0.02 * w) / 1.02; b[i] = l * 3.5; }
        else if (color === 'pink') { p0 = 0.997 * p0 + 0.029591 * w; p1 = 0.985 * p1 + 0.032534 * w; p2 = 0.95 * p2 + 0.048056 * w; b[i] = (p0 + p1 + p2 + 0.05 * w) * 2.2; }
        else b[i] = w;
      }
      return b;
    }
    // RBJ biquad; f may be a number or a function of time (coefficients refreshed every 16 samples)
    function filt(b, type, f, q = 0.707) {
      let x1 = 0, x2 = 0, y1 = 0, y2 = 0, b0, b1, b2, a1, a2;
      const fn = typeof f === 'function' ? f : null;
      const coef = hz => {
        const w = 2 * Math.PI * Math.min(Math.max(hz, 10), SR * 0.45) / SR, c = Math.cos(w), al = Math.sin(w) / (2 * q), a0 = 1 + al;
        if (type === 'lp') { b0 = (1 - c) / 2; b1 = 1 - c; b2 = b0; }
        else if (type === 'hp') { b0 = (1 + c) / 2; b1 = -(1 + c); b2 = b0; }
        else { b0 = al; b1 = 0; b2 = -al; }                // band-pass, 0 dB peak
        b0 /= a0; b1 /= a0; b2 /= a0; a1 = -2 * c / a0; a2 = (1 - al) / a0;
      };
      coef(fn ? fn(0) : f);
      for (let i = 0; i < b.length; i++) {
        if (fn && (i & 15) === 0) coef(fn(i / SR));
        const x = b[i], y = b0 * x + b1 * x1 + b2 * x2 - a1 * y1 - a2 * y2;
        x2 = x1; x1 = x; y2 = y1; y1 = y; b[i] = y;
      }
      return b;
    }
    function env(b, fn) { for (let i = 0; i < b.length; i++) b[i] *= fn(i / SR); return b; }
    const ad = (a, d) => t => t < a ? t / a : Math.exp(-(t - a) / d);          // attack / exponential decay
    const exp = (from, to, tau) => t => to + (from - to) * Math.exp(-t / tau);    // exponential glide
    function osc(sec, f, shape = 'sine') {
      const b = N(sec), fn = typeof f === 'function' ? f : () => f; let ph = 0;
      for (let i = 0; i < b.length; i++) {
        ph += fn(i / SR) / SR; ph -= Math.floor(ph);
        b[i] = shape === 'sine' ? Math.sin(ph * 6.283185) : shape === 'saw' ? ph * 2 - 1
             : shape === 'square' ? (ph < 0.5 ? 1 : -1) : 1 - 4 * Math.abs(ph - 0.5);
      }
      return b;
    }
    // modal synthesis: struck object = sum of exponentially decaying partials [freq, amp, decay]
    function modes(sec, list, r) {
      const b = N(sec);
      for (const [f, a, d] of list) {
        const ph = r ? r() * 6.28 : 0, w = 6.283185 * f / SR;
        for (let i = 0; i < b.length; i++) b[i] += a * Math.sin(w * i + ph) * Math.exp(-i / SR / d);
      }
      return b;
    }
    function mix(dst, src, g = 1, at = 0) {
      const o = Math.round(at * SR);
      for (let i = 0; i < src.length && i + o < dst.length; i++) dst[i + o] += src[i] * g;
      return dst;
    }
    function drive(b, k) { const n = Math.tanh(k); for (let i = 0; i < b.length; i++) b[i] = Math.tanh(b[i] * k) / n; return b; }
    function norm(b, peak = 0.9) {
      let m = 1e-6; for (let i = 0; i < b.length; i++) m = Math.max(m, Math.abs(b[i]));
      const k = peak / m; for (let i = 0; i < b.length; i++) b[i] *= k;
      const f = Math.min(b.length, Math.round(0.004 * SR));                       // de-click the tail
      for (let i = 0; i < f; i++) b[b.length - 1 - i] *= i / f;
      return b;
    }
    // seamless loop: render a little longer and cross-fade the overhang into the start
    function looped(sec, gen) {
      const x = Math.round(0.08 * SR), full = gen(sec + x / SR), out = N(sec);
      for (let i = 0; i < out.length; i++) out[i] = full[i];
      for (let i = 0; i < x; i++) { const k = i / x; out[i] = out[i] * k + full[out.length + i] * (1 - k); }
      return out;
    }
    // a cloud of tiny clicks: debris, gravel, crackle
    function grains(sec, n, r, f0, f1, dec, spread = 1) {
      const b = N(sec);
      for (let k = 0; k < n; k++) {
        const t = Math.pow(r(), spread) * sec * 0.85, g = noise(dec * 6, r);
        filt(g, 'bp', f0 + r() * (f1 - f0), 1.6); env(g, ad(0.0004, dec));
        mix(b, g, 0.4 + r() * 0.6, t);
      }
      return b;
    }
    const semis = n => Math.pow(2, n / 12);

    // ---- recipes: (r, v) => Float32Array; r is a seeded rng, v the variant index ----
    const R = {
      shot(r) {
        const len = 0.24, o = N(len), p = 0.9 + r() * 0.2;
        const body = noise(len, r); filt(body, 'bp', exp(1700 * p, 320, 0.05), 0.9); env(body, ad(0.0006, 0.032));
        const thump = osc(len, exp(170 * p, 44, 0.012)); env(thump, ad(0.0008, 0.05));
        const crack = noise(0.04, r); filt(crack, 'hp', 3200); env(crack, ad(0.0002, 0.005));
        const mech = modes(0.06, [[2300 * p, 0.3, 0.006], [3900 * p, 0.2, 0.004]], r);
        mix(o, body, 1.0); mix(o, thump, 0.9); mix(o, crack, 0.55); mix(o, mech, 0.4, 0.012);
        return norm(filt(drive(o, 2.2), 'hp', 45), 0.95);
      },
      hit_wood(r) {
        const f = 330 + r() * 180, o = modes(0.16, [[f, 1, 0.03], [f * 2.31, 0.55, 0.017], [f * 4.2, 0.25, 0.009]], r);
        const n = noise(0.06, r); filt(n, 'bp', 1400 + r() * 600, 1.2); env(n, ad(0.0005, 0.012));
        return norm(mix(o, n, 0.7), 0.7);
      },
      hit_stone(r, v) {
        const len = v >= 2 ? 0.42 : 0.12, o = N(len);
        const n = noise(0.05, r); filt(n, 'hp', 2600); env(n, ad(0.0002, 0.006)); mix(o, n, 1);
        const b = noise(0.08, r); filt(b, 'bp', 1900 + r() * 900, 1.4); env(b, ad(0.0005, 0.018)); mix(o, b, 0.7);
        if (v >= 2) {                                     // every other variant ricochets
          const f0 = 2600 + r() * 1400, rc = osc(0.36, t => f0 * (0.55 + 0.45 * Math.exp(-t / 0.25)) * (1 + 0.012 * Math.sin(t * 90)));
          env(rc, ad(0.01, 0.1)); mix(o, rc, 0.32, 0.015);
        }
        return norm(o, 0.65);
      },
      hit_flesh(r) {
        const o = N(0.2), n = noise(0.2, r); filt(n, 'lp', 600); env(n, ad(0.001, 0.045)); mix(o, n, 1);
        const s = osc(0.2, exp(120, 55, 0.04)); env(s, ad(0.001, 0.05)); mix(o, s, 0.8);
        const q = noise(0.2, r); filt(q, 'bp', exp(1200 + r() * 400, 260, 0.06), 5); env(q, ad(0.004, 0.06)); mix(o, q, 0.9);
        return norm(drive(o, 1.6), 0.7);
      },
      hit_dirt(r) {
        const o = noise(0.12, r); filt(o, 'lp', 1300); env(o, ad(0.0006, 0.022));
        mix(o, grains(0.12, 5, r, 1500, 3500, 0.004), 0.35);
        return norm(o, 0.35);
      },
      hit_boss(r) {

      if (!tgtValid(grab.target)) grab.target = cand;   // цель пропала — наводимся на следующую
      targetOpen = 0.8;
      grab.len += ARM_SPEED * dt;
      const t = grab.target;
      if (t) {
        const p = tgtPos(t);
        const d = Math.hypot(p.x - armW.x, p.z - armW.z);
        aimYaw = yawToward(p.x, p.z);
        const need = d - t.r * 0.9 - CLAW_REACH;
        if (need > ARM_MAX) grab.target = null;                // уехала из досягаемости
        else if (grab.len >= need && t.kind === 'enemy' && t.ref.elite) {
          // архизлюку не схватить: огрызается и отшвыривает машину
          const e = t.ref;
          wakeEnemy(e);
          const ax = car.pos.x - e.pos.x, az = car.pos.z - e.pos.z, ad = Math.hypot(ax, az) || 1;
          car.vel.x += ax / ad * 24; car.vel.z += az / ad * 24; car.speed *= 0.2;
          if (!car.airborne && car.burrow === 'up') { car.vy = 6; car.airborne = true; car.usedDouble = true; car.popped = true; }
          e.open = 1; e.wakeT = 0.45; e.biteCd = Math.max(e.biteCd, 0.6);
          spawnParticles(tmp.set(e.pos.x, 2, e.pos.z), 0xd040a0, 14, 9);
          spawnParticles(new THREE.Vector3().copy(armW).addScaledVector(tmp.set(-ax / ad, 0, -az / ad), grab.len).setY(2), 0xffe08a, 6, 8);
          shake = Math.max(shake, 0.6);
          flashAlert('ARCH-BITER WON\'T BUDGE!'); SFX.play('zap', e.pos); SFX.play('growl_elite', e.pos, { delay: 0.05 });
          grab.target = null; grab.state = 'retract'; grab.cd = 1.2;
        }
        else if (grab.len >= need) {
          grab.len = Math.max(ARM_MIN, need);
          if (t.kind === 'enemy') wakeEnemy(t.ref);
          t.ref.carried = true;
          t.shieldMax = t.shieldHp = t.kind === 'crate' ? 60 : (t.ref.elite ? 90 : 50);
          grab.held = t; grab.target = null; grab.state = 'pull'; SFX.play('slap', p);
          holdPos.set(p.x, HOLD_Y, p.z);
          shake = Math.max(shake, 0.2);

      }
      if (grab.state === 'reach' && (!want || grab.len >= ARM_MAX)) { grab.state = 'retract'; grab.target = null; }
    }
    else if (grab.state === 'retract') {
      grab.len -= ARM_SPEED * 0.8 * dt;

    }
    else if (grab.state === 'pull' || grab.state === 'hold') {
      const h = grab.held;
      // точка на буре: объект насажен на остриё
      const dest = toWorld(0, 3.4 + h.r * 0.7, tmp).setY(HOLD_Y + car.y + Math.sin(elapsed * 9) * 0.05);   // прыгает вместе с машиной
      const step = PULL_SPEED * dt, gap = holdPos.distanceTo(dest);
      if (grab.state === 'hold' || gap <= step) { holdPos.copy(dest); grab.state = 'hold'; }
      else holdPos.addScaledVector(dest.sub(holdPos).normalize(), step);
      {                                                       // объезжает кузов, а не протаскивается сквозь
        const ox = holdPos.x - car.pos.x, oz = holdPos.z - car.pos.z, od = Math.hypot(ox, oz) || 1e-4;
        const minR = car.radius + h.r * 0.9;
        if (od < minR && grab.state === 'pull') { holdPos.x = car.pos.x + ox / od * minR; holdPos.z = car.pos.z + oz / od * minR; }
      }
      const d = Math.hypot(holdPos.x - armW.x, holdPos.z - armW.z);
      aimYaw = yawToward(holdPos.x, holdPos.z);
      grab.len = Math.max(ARM_MIN, d - h.r * 0.85 - CLAW_REACH * 0.7);
      targetOpen = 0.4;
      placeHeld(h);
      // тем, что на буре, можно таранить других злюк
      const sp = Math.hypot(car.vel.x, car.vel.z);
      for (const e of enemies) {
        if (e.dead || e.carried || e === h.ref || e.ramCd > 0) continue;
        const dx = e.pos.x - holdPos.x, dz = e.pos.z - holdPos.z, dd = Math.hypot(dx, dz) || 1e-4;
        if (dd < e.r + h.r) {
          e.ramCd = 0.4;
          hitEnemy(e, tmp.set(dx / dd, 0, dz / dd), sp > 6 ? 1.5 : 0.5, 6 + sp * 0.6);
          spawnParticles(tmp.copy(e.pos).setY(1), 0xffd27a, 4, 6); SFX.play('hit_flesh', e.pos);
          shake = Math.max(shake, 0.25);

      if (!want && grab.held) { throwHeld(car.alive ? groundAim : null); grab.state = 'retract'; }
    }

    // маркер цели
    const showT = grab.state === 'reach' && grab.target ? grab.target : (grab.state === 'idle' ? cand : null);
    targetMarker.visible = !!showT;
    if (showT) {
      const p = tgtPos(showT);
      targetMarker.position.set(p.x, showT.s + 1.3 + Math.sin(elapsed * 6) * 0.15, p.z);

    }

    let dy = aimYaw - grab.yaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy));
    grab.yaw += dy * Math.min(1, 18 * dt);

      if (!impact && th.hostile && car.alive && car.depth < 0.3 &&            // ящик босса прилетел в нас
          Math.hypot(th.pos.x - car.pos.x, th.pos.z - car.pos.z) < car.radius + th.r * 0.8 && th.pos.y < car.y + 2.6) {

      const dir = tmp.set(th.vel.x, 0, th.vel.z).normalize().clone();
      if (!impact) for (const e of enemies) {

        if (m.dead || Math.hypot(th.pos.x - m.pos.x, th.pos.z - m.pos.z) > th.r + m.r + 0.3 || th.pos.y > critterTop(m) + 0.6) continue;
        hitCritter(m, 4, dir, 14); SFX.play('hit_flesh', th.pos); impact = true;
      }
      if (!impact) for (const o of obstacles) {
        if (!active(o) || o === th.ref || (o.boss && th.hostile)) continue;
        const p = o.mesh.position;
        if (Math.abs(th.pos.x - p.x) < o.hx + th.r * 0.7 && Math.abs(th.pos.z - p.z) < o.hz + th.r * 0.7 && th.pos.y < o.h + th.r * 0.5) {
          if (o.crate) damageCrate(o, 3);

          else if (!o.crate) SFX.play('hit_stone', th.pos);

  // ---------- burrow ----------
  const SINK_TIME = 0.35, RISE_TIME = 0.4, BURY_DEPTH = 2.8;
  const dirtMat = new THREE.MeshStandardMaterial({ color: 0x6b5a3e, roughness: 1 });
  const mound = new THREE.Group();
  {
    const hill = new THREE.Mesh(new THREE.SphereGeometry(2.3, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2), dirtMat);
    hill.scale.y = 0.35; mound.add(hill);
    for (let i = 0; i < 7; i++) {                    // комья вокруг
      const a = i / 7 * Math.PI * 2 + rand(-0.3, 0.3), rr = rand(1.9, 2.6);
      const clod = new THREE.Mesh(new THREE.BoxGeometry(rand(0.35, 0.6), rand(0.25, 0.45), rand(0.35, 0.6)), dirtMat);
      clod.position.set(Math.cos(a) * rr, 0.15, Math.sin(a) * rr); clod.rotation.y = rand(0, 3);
      mound.add(clod);

    mound.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } });
  }

  let dirtT = 0;

  const carSeen = () => car.alive && car.depth < 0.5;

  function toggleBurrow() {
    if (!abilities.burrow || !car.alive || car.burrowCd > 0 || car.airborne) return;
    if (car.burrow === 'up' || car.burrow === 'rising') { car.burrow = 'down'; SFX.play('dig_down', car.pos); crewSay('burrow', 0.7); }
    else { car.burrow = 'rising'; SFX.play('dig_up', car.pos); }
    car.burrowCd = 0.25;
    shake = Math.max(shake, 0.3);
    spawnParticles(tmp.copy(car.pos).setY(0.5), 0x6b5a3e, 12, 8);
  }

  function updateBurrow(dt) {
    car.burrowCd -= dt;
    if (car.burrow === 'down') {
      car.depth = Math.min(1, car.depth + dt / SINK_TIME);
      if (car.depth >= 1) car.burrow = 'under';
    } else if (car.burrow === 'rising') {
      car.depth = Math.max(0, car.depth - dt / RISE_TIME);
      if (car.depth <= 0) car.burrow = 'up';
    }
    const moving = car.burrow === 'down' || car.burrow === 'rising';
    if (moving) {
      drillSpin.rotation.z += 40 * dt;               // бур роет
      dirtT -= dt;
      if (dirtT <= 0) { dirtT = 0.03; spawnParticles(tmp.copy(car.pos).setY(0.3), Math.random() < 0.7 ? 0x6b5a3e : 0x4a4f45, 3, 9); }
      shake = Math.max(shake, 0.15);
    }
    carGroup.position.y = car.y - car.depth * BURY_DEPTH;
    carGroup.visible = car.alive && car.depth < 0.97;
    mound.visible = car.alive && car.depth > 0.15;
    if (mound.visible) {
      const sc = Math.min(1, car.depth * 1.3);
      mound.position.set(car.pos.x, 0, car.pos.z);
      mound.scale.set(sc, sc * (car.burrow === 'under' ? 1 + Math.sin(elapsed * 3) * 0.06 : 1), sc); // нора дышит
    }
  }

  // ---------- skid marks + tire smoke ----------
  const SKID_SLIP = 2.6, SKID_LIFE = 6, SKID_MAX = 360;
  const skidGeo = new THREE.PlaneGeometry(0.42, 0.75); skidGeo.rotateX(-Math.PI / 2);
  const skids = []; let skidHead = 0, skidT = 0;
  const smoke = []; let dustT = 0;
  const smokeGeo = new THREE.SphereGeometry(0.45, 7, 5);
  const wpos = new THREE.Vector3();
  function updateSkid(dt, lateral) {
    const slip = Math.abs(lateral);
    SFX.loop('skid', car.alive && car.depth === 0 && !car.airborne && slip > SKID_SLIP ? Math.min(0.35, (slip - SKID_SLIP) / 14) : 0, 0.9 + Math.min(0.3, slip / 40));
    skidT -= dt; dustT -= dt;
    const gspd = Math.hypot(car.vel.x, car.vel.z);
    if (ride === 'buggy' && car.alive && car.depth === 0 && !car.airborne && gspd > 8 && dustT <= 0) {   // dust trail
      dustT = 0.045;
      wheels[2 + (Math.random() < 0.5 ? 0 : 1)].pivot.getWorldPosition(wpos); wpos.y = 0.3;
      puff(wpos, 0xa8977c, 0.9, 0.8, rand(-0.5, 0.5), rand(0.3, 0.9), rand(-0.5, 0.5), 0.2 * Math.min(1, gspd / 20), 2.4);
    }
    if (car.alive && car.depth === 0 && !car.airborne && slip > SKID_SLIP && skidT <= 0) {
      skidT = 0.025;
      const yaw = Math.atan2(car.vel.x, car.vel.z);
      const strength = Math.min(1, (slip - SKID_SLIP) / 8);
      for (const w of [wheels[2], wheels[3]]) {        // задние колёса
        w.pivot.getWorldPosition(wpos);
        let sk = skids[skidHead];
        if (!sk) { sk = { m: new THREE.Mesh(skidGeo, new THREE.MeshBasicMaterial({ color: 0x1c1c1a, transparent: true, depthWrite: false })), t: 0 }; scene.add(sk.m); skids[skidHead] = sk; }
        sk.m.position.set(wpos.x, 0.02 + skidHead * 0.00001, wpos.z);
        sk.m.rotation.y = yaw; sk.t = SKID_LIFE; sk.a = 0.25 + 0.35 * strength;
        sk.m.material.opacity = sk.a; sk.m.visible = true;
        skidHead = (skidHead + 1) % SKID_MAX;
        if (Math.random() < 0.3 + strength * 0.45) {      // tyre smoke
          wpos.y = 0.35;
          puff(wpos, 0xd8d6d0, 1.3, 1.0, rand(-0.6, 0.6) - car.vel.x * 0.08, rand(0.8, 1.6), rand(-0.6, 0.6) - car.vel.z * 0.08, 0.4);
        }
      }
    }
    for (const sk of skids) {
      if (!sk || !sk.m.visible) continue;
      sk.t -= dt;
      if (sk.t <= 0) sk.m.visible = false;
      else if (sk.t < 1.5) sk.m.material.opacity = sk.a * sk.t / 1.5;
    }
    for (let i = smoke.length - 1; i >= 0; i--) {
      const p = smoke[i];
      p.life -= dt;
      p.m.position.addScaledVector(p.v, dt);
      p.m.scale.multiplyScalar(1 + 1.6 * dt);
      p.m.material.opacity = Math.max(0, p.life / 0.9 * 0.55);
      if (p.life <= 0) { scene.remove(p.m); p.m.material.dispose(); smoke.splice(i, 1); }
    }
  }

  // ---------- jump ----------
  const JUMP_V = 15, CAR_G = 32;                    // ~0.95 с в воздухе, высота ~3.5 — перелетает ящики и злюк
  function jump() {
    if (!car.alive || car.burrow !== 'up') return;
    if (!car.airborne) {
      if (!abilities.jump) return;
      car.vy = JUMP_V; car.airborne = true; car.usedDouble = false; SFX.play('jump', car.pos); crewSay('jump', 0.5);
      if (ride === 'spider' && SPD.n.y < 0.5) { car.vel.addScaledVector(SPD.n, 10); car.vy *= 0.6; }      // kick off the wall
      spawnParticles(tmp.copy(car.pos).setY(0.2), 0x8a8a78, 8, 5);
    } else if (abilities.doubleJump && !car.usedDouble) {   // второй толчок прямо в воздухе
      car.vy = JUMP_V * 0.95; car.usedDouble = true; SFX.play('jump2', car.pos);
      spawnParticles(tmp.copy(car.pos).setY(car.y + 0.3), 0xc9a8ff, 12, 6);
      shake = Math.max(shake, 0.15);
    }
  }
  function updateJump(dt) {
    if (!car.airborne) return;
    car.vy -= CAR_G * dt;
    car.y += car.vy * dt;
    if (car.y > (car.ground || 0)) return;
    // приземление
    const impact = -car.vy;
    car.y = car.ground || 0; car.vy = 0; car.airborne = false;
    shake = Math.max(shake, 0.25 + impact * 0.02);
    SFX.play('land', car.pos, { vol: Math.min(1, 0.4 + impact / 25) });
    spawnParticles(tmp.copy(car.pos).setY(0.2), 0x8a8a78, 14, 7); burst(tmp.setY(0.4), 0x9a8f7c, 9, 1.5, 5, 0.3);
    const popped = car.popped; car.popped = false;
    cartKick(3.5);
    if (!popped) for (const e of enemies) {          // приземлились на злюку — придавили
      if (e.dead || e.carried) continue;
      const dx = e.pos.x - car.pos.x, dz = e.pos.z - car.pos.z, d = Math.hypot(dx, dz) || 1e-4;
      if (d < car.radius + e.r * 0.8) {

        e.stun = 0.8;

      }

      if (m.dead || m.K.fly) continue;
      const dx = m.pos.x - car.pos.x, dz = m.pos.z - car.pos.z, d = Math.hypot(dx, dz) || 1e-4;
      if (d < car.radius + m.r + 0.8) hitCritter(m, m.K.heavy ? 3 : 99, tmp.set(dx / d, 0, dz / d), 10);
    }

      const p = o.mesh.position;
      const cx = THREE.MathUtils.clamp(car.pos.x, p.x - o.hx, p.x + o.hx);
      const cz = THREE.MathUtils.clamp(car.pos.z, p.z - o.hz, p.z + o.hz);
      if (Math.hypot(car.pos.x - cx, car.pos.z - cz) < car.radius) damageCrate(o, 99);
    }
  }

  function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

    ctx.beginPath(); ctx.moveTo(21, -33); ctx.lineTo(27, -48); ctx.lineTo(29, -31); ctx.closePath(); ctx.fill();
    ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(12, -4); ctx.lineTo(26, 6); ctx.stroke(); // лапка

  function makeIcon(type) {
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const ctx = c.getContext('2d');
    rr(ctx, 4, 4, 120, 120, 22); ctx.fillStyle = AB_INFO[type].bg; ctx.fill();
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.stroke();
